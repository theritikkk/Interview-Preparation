<text x='430.0' y='418' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5b6472'>syscall entry, interrupts/APIC, page-table and MMU setup, context-switch assembly — files 08, 14, 21, 22</text>
<text x='430.0' y='470' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>Kernel code runs in one of three contexts:</text>
<text x='430.0' y='490' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>process context (on behalf of a syscall)  ·  interrupt context (a handler, cannot sleep)  ·  kernel threads (kworker, ksoftirqd...)</text>
<text x='430.0' y='512' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5b6472'>All three share the same kernel address space — which is why file 23's locking discipline is everywhere.</text>
