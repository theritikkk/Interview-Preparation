<svg width="720" height="560" viewBox="0 0 720 560" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>The Linux storage I/O stack</title>
  <desc>Layers a read or write passes through: application, syscall interface, VFS, page cache, a concrete file system, the block layer and I/O scheduler, the device driver, and the physical device — with the chapter that covers each layer.</desc>
  <rect width="720" height="560" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">The storage I/O stack, top to bottom</text>

  <defs>
    <marker id="arrow6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#73726c"/>
    </marker>
  </defs>

  <!-- Application -->
  <rect x="180" y="50" width="360" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="360" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C2C2A">Application</text>
  <line x1="360" y1="100" x2="360" y2="126" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow6)"/>

  <!-- Syscalls -->
  <rect x="160" y="130" width="400" height="50" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="360" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#712B13">read(2) / write(2) syscalls — Ch. 8</text>
  <line x1="360" y1="180" x2="360" y2="206" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow6)"/>

  <!-- VFS + page cache -->
  <rect x="140" y="210" width="440" height="60" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="360" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#085041">VFS + page / inode / directory caches — Ch. 8</text>
  <text x="360" y="253" text-anchor="middle" font-size="11" fill="#085041">most reads are satisfied here — no physical I/O at all</text>
  <line x1="360" y1="270" x2="360" y2="296" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow6)"/>

  <!-- File system -->
  <rect x="160" y="300" width="400" height="50" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="360" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#085041">ext4 / xfs / btrfs — Ch. 8</text>
  <line x1="360" y1="350" x2="360" y2="376" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow6)"/>

  <!-- Block layer -->
  <rect x="140" y="380" width="440" height="60" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="360" y="405" text-anchor="middle" font-size="13" font-weight="bold" fill="#3C3489">Block I/O layer + I/O scheduler (blk-mq) — Ch. 9</text>
  <text x="360" y="423" text-anchor="middle" font-size="11" fill="#3C3489">queueing, merging, per-CPU dispatch</text>
  <line x1="360" y1="440" x2="360" y2="466" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow6)"/>

  <!-- Driver -->
  <rect x="160" y="470" width="400" height="40" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="360" y="495" text-anchor="middle" font-size="13" font-weight="bold" fill="#633806">Device driver (SCSI / NVMe) — Ch. 9</text>
  <line x1="360" y1="510" x2="360" y2="522" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow6)"/>

  <!-- Device -->
  <rect x="220" y="526" width="280" height="28" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="360" y="545" text-anchor="middle" font-size="12" fill="#2C2C2A">Physical storage device</text>
</svg>
