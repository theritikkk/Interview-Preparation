# Shard map. Every client computes the identical ring from this file.
#   vnodes     virtual nodes per shard on the ring
#   state      stable | migrating   (migrating = a rebalance is in progress)
#   shards     the ring clients converge on (the NEW ring while migrating)
#   old_shards the ring before the change (only read while migrating)
vnodes 128
state stable
shards 1 2 3
