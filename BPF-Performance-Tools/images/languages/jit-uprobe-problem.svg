<svg width="760" height="360" viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Why a uprobe cannot safely target JIT-compiled code</title>
  <desc>Two independent causes, each sufficient on its own: the JIT compiler can relocate a function without telling the kernel, risking memory corruption if a uprobe later restores bytes at the wrong address; and JIT code typically lives in an anonymous memory mapping with no backing file, which uprobes require.</desc>
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="380" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Why uprobes can't safely target JIT-compiled code (Ch. 12 §12.1.2)</text>

  <!-- Cause 1 -->
  <rect x="30" y="55" width="330" height="90" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="195" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#712B13">Cause 1: the JIT relocates code</text>
  <text x="195" y="98" text-anchor="middle" font-size="11" fill="#712B13">The JIT can move or recompile a</text>
  <text x="195" y="114" text-anchor="middle" font-size="11" fill="#712B13">function at any time, with no</text>
  <text x="195" y="130" text-anchor="middle" font-size="11" fill="#712B13">way to notify the kernel</text>

  <!-- Cause 2 -->
  <rect x="400" y="55" width="330" height="90" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="565" y="78" text-anchor="middle" font-size="12" font-weight="bold" fill="#712B13">Cause 2: no backing file</text>
  <text x="565" y="98" text-anchor="middle" font-size="11" fill="#712B13">uprobes are file/inode-based,</text>
  <text x="565" y="114" text-anchor="middle" font-size="11" fill="#712B13">but JIT'd code usually lives in an</text>
  <text x="565" y="130" text-anchor="middle" font-size="11" fill="#712B13">anonymous memory mapping</text>

  <defs>
    <marker id="arrowJ" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#73726c"/>
    </marker>
  </defs>
  <line x1="195" y1="145" x2="195" y2="185" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowJ)"/>
  <line x1="565" y1="145" x2="565" y2="185" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowJ)"/>

  <!-- Effect 1 -->
  <rect x="30" y="190" width="330" height="80" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/>
  <text x="195" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#791F1F">Effect: memory corruption</text>
  <text x="195" y="232" text-anchor="middle" font-size="11" fill="#791F1F">Removing the probe later restores</text>
  <text x="195" y="248" text-anchor="middle" font-size="11" fill="#791F1F">bytes at the WRONG address</text>
  <text x="195" y="262" text-anchor="middle" font-size="11" fill="#791F1F">— overwriting unrelated data</text>

  <!-- Effect 2 -->
  <rect x="400" y="190" width="330" height="80" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/>
  <text x="565" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#791F1F">Effect: nothing to attach to</text>
  <text x="565" y="232" text-anchor="middle" font-size="11" fill="#791F1F">There is no file-backed address</text>
  <text x="565" y="248" text-anchor="middle" font-size="11" fill="#791F1F">for the probe to target in the</text>
  <text x="565" y="262" text-anchor="middle" font-size="11" fill="#791F1F">first place</text>

  <!-- Safe alternative box -->
  <rect x="140" y="290" width="480" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="380" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#085041">What actually works instead</text>
  <text x="380" y="330" text-anchor="middle" font-size="11" fill="#085041">USDT / dynamic USDT probes, or reading an already-captured</text>
  <text x="380" y="344" text-anchor="middle" font-size="10" fill="#085041">stack address later via a supplemental symbol file (safe — no write involved)</text>
</svg>
