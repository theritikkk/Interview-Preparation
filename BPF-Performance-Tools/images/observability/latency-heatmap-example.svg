<svg width="720" height="420" viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>How a latency heat map is built</title>
  <desc>A grid where the x-axis is time in one-second columns, the y-axis is a latency bucket, and color saturation shows the event count in that cell — revealing a slow mode that persists over time, which a single aggregate histogram of the same data would average away.</desc>
  <rect width="720" height="420" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Latency heat map (Ch. 17): time × latency × count</text>

  <!-- Axes -->
  <line x1="90" y1="60" x2="90" y2="330" stroke="#888780" stroke-width="1"/>
  <line x1="90" y1="330" x2="650" y2="330" stroke="#888780" stroke-width="1"/>
  <text x="60" y="70" font-size="11" fill="#5F5E5A" text-anchor="end">slow</text>
  <text x="60" y="325" font-size="11" fill="#5F5E5A" text-anchor="end">fast</text>
  <text x="30" y="200" font-size="12" fill="#5F5E5A" transform="rotate(-90 30 200)" text-anchor="middle">latency</text>
  <text x="370" y="360" font-size="12" fill="#5F5E5A" text-anchor="middle">time (one column per second) →</text>

  <!-- Grid cells: mostly light (few events) in the fast band -->
  <!-- fast band, light teal, nearly every column -->
  <g fill="#9FE1CB">
    <rect x="95" y="290" width="34" height="34"/>
    <rect x="133" y="290" width="34" height="34"/>
    <rect x="171" y="290" width="34" height="34"/>
    <rect x="209" y="290" width="34" height="34"/>
    <rect x="247" y="290" width="34" height="34"/>
    <rect x="285" y="290" width="34" height="34"/>
    <rect x="323" y="290" width="34" height="34"/>
    <rect x="361" y="290" width="34" height="34"/>
    <rect x="399" y="290" width="34" height="34"/>
    <rect x="437" y="290" width="34" height="34"/>
    <rect x="475" y="290" width="34" height="34"/>
    <rect x="513" y="290" width="34" height="34"/>
    <rect x="551" y="290" width="34" height="34"/>
    <rect x="589" y="290" width="34" height="34"/>
  </g>

  <!-- slow band, dark coral, persistent across every column - THE FINDING -->
  <g fill="#993C1D">
    <rect x="95" y="150" width="34" height="34"/>
    <rect x="133" y="150" width="34" height="34"/>
    <rect x="171" y="150" width="34" height="34"/>
    <rect x="209" y="150" width="34" height="34"/>
    <rect x="247" y="150" width="34" height="34"/>
    <rect x="285" y="150" width="34" height="34"/>
    <rect x="323" y="150" width="34" height="34"/>
    <rect x="361" y="150" width="34" height="34"/>
    <rect x="399" y="150" width="34" height="34"/>
    <rect x="437" y="150" width="34" height="34"/>
    <rect x="475" y="150" width="34" height="34"/>
    <rect x="513" y="150" width="34" height="34"/>
    <rect x="551" y="150" width="34" height="34"/>
    <rect x="589" y="150" width="34" height="34"/>
  </g>

  <!-- callout -->
  <line x1="606" y1="150" x2="660" y2="120" stroke="#712B13" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="662" y="118" font-size="11" fill="#712B13">consistently present —</text>
  <text x="662" y="132" font-size="11" fill="#712B13">not a one-off spike</text>

  <rect x="60" y="376" width="600" height="34" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="360" y="397" text-anchor="middle" font-size="12" fill="#633806">A single aggregate histogram of this same data hides the "over time" dimension entirely</text>
</svg>
