<svg xmlns='http://www.w3.org/2000/svg' width='780' height='460' viewBox='0 0 780 460' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x='0' y='0' width='780' height='460' fill='#fdfdfc'/>
<defs><marker id='arrow' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L0,6 L9,3 z' fill='#3a4556'/></marker></defs>
<text x='390.0' y='26' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='15.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>The Stack Grows Downward — Proven by Address (§3.4.4)</text>
<rect x='325.0' y='60' width='130' height='40' rx='6' fill='#f1f1ef' stroke='#9a9a95' stroke-width='1.6'/>
<text x='390.0' y='85.0' font-family='Consolas,Menlo,Monaco,monospace' font-size='13' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>0x8000</text>
<text x='469.0' y='85.0' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='normal' font-style='normal' text-anchor='start' fill='#1a2233'>bp  (stack base)</text>
<rect x='325.0' y='108' width='130' height='40' rx='6' fill='#eaf1fb' stroke='#4a6fa5' stroke-width='1.6'/>
<text x='390.0' y='133.0' font-family='Consolas,Menlo,Monaco,monospace' font-size='13' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>0x7ffe</text>
<text x='469.0' y='133.0' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='normal' font-style='normal' text-anchor='start' fill='#1a2233'>'A'  (0x0041)  ← pushed 1st</text>
<rect x='325.0' y='156' width='130' height='40' rx='6' fill='#eaf1fb' stroke='#4a6fa5' stroke-width='1.6'/>
<text x='390.0' y='181.0' font-family='Consolas,Menlo,Monaco,monospace' font-size='13' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>0x7ffc</text>
<text x='469.0' y='181.0' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='normal' font-style='normal' text-anchor='start' fill='#1a2233'>'B'  (0x0042)  ← pushed 2nd</text>
<rect x='325.0' y='204' width='130' height='40' rx='6' fill='#fff2d9' stroke='#c9820a' stroke-width='1.6'/>
<text x='390.0' y='229.0' font-family='Consolas,Menlo,Monaco,monospace' font-size='13' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>0x7ffa</text>
<text x='469.0' y='229.0' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='normal' font-style='normal' text-anchor='start' fill='#1a2233'>'C'  (0x0043)  ← pushed 3rd, sp here</text>
<line x1='295.0' y1='70' x2='295.0' y2='234' stroke='#c9820a' stroke-width='1.8'  marker-end='url(#arrow)'/>
<text x='280.0' y='152.0' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' font-style='normal' text-anchor='end' fill='#c9820a'>sp</text>
<text x='390.0' y='272' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='600' font-style='normal' text-anchor='middle' fill='#1a2233'>pop bx → 'C' (first out, LIFO)   —   pop bx → 'B'   —   sp now back at 0x7ffe</text>
<text x='390.0' y='298' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>mov al, [0x7ffe]  reads the FIRST value ever pushed — 'A' — proving the base sits</text>
<text x='390.0' y='316' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>just below bp, and each new push landed at successively LOWER addresses.</text>
