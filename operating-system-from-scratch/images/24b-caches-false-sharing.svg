<rect x='300' y='357' width='130' height='28' rx='6' fill='#e7f7ee' stroke='#2f9e5c' stroke-width='1.6'/>
<text x='365' y='377' font-family='Consolas,Menlo,Monaco,monospace' font-size='12' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>y</text>
<text x='540' y='377' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5b6472'>(rest of the line)</text>
<text x='400.0' y='417' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>Core 0 writes only x. Core 1 writes only y. No logical sharing at all —</text>
<text x='400.0' y='435' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>yet the whole line bounces between their caches on every write. Often several times slower.</text>
