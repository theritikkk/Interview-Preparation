<svg width="720" height="420" viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>The five BPF event sources</title>
  <desc>Comparison of dynamic instrumentation (kprobes, uprobes), static instrumentation (tracepoints, USDT), and hardware sampling (PMCs), grouped by stability and typical use.</desc>
  <rect width="720" height="420" fill="#ffffff"/>

  <!-- Dynamic group -->
  <rect x="20" y="50" width="330" height="150" rx="10" fill="none" stroke="#D85A30" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="35" y="40" font-size="13" font-weight="bold" fill="#712B13">Dynamic instrumentation — any function, unstable</text>

  <rect x="40" y="70" width="130" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="105" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#712B13">kprobe</text>
  <text x="105" y="110" text-anchor="middle" font-size="11" fill="#712B13">Kernel function</text>

  <rect x="190" y="70" width="140" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="260" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#712B13">uprobe</text>
  <text x="260" y="110" text-anchor="middle" font-size="11" fill="#712B13">User function</text>

  <text x="35" y="150" font-size="12" fill="#712B13" width="310">Zero cost until attached. Can break</text>
  <text x="35" y="168" font-size="12" fill="#712B13">on any kernel/software upgrade.</text>
  <text x="35" y="188" font-size="12" fill="#712B13">uprobes also trap into the kernel —</text>

  <!-- Static group -->
  <rect x="370" y="50" width="330" height="150" rx="10" fill="none" stroke="#1D9E75" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="385" y="40" font-size="13" font-weight="bold" fill="#085041">Static instrumentation — stable, limited</text>

  <rect x="390" y="70" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="460" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">tracepoint</text>
  <text x="460" y="110" text-anchor="middle" font-size="11" fill="#085041">Kernel, maintained</text>

  <rect x="550" y="70" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="615" y="92" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">USDT</text>
  <text x="615" y="110" text-anchor="middle" font-size="11" fill="#085041">User, opt-in build</text>

  <text x="385" y="150" font-size="12" fill="#085041">Near-zero cost when disabled (a</text>
  <text x="385" y="168" font-size="12" fill="#085041">patched no-op). Best-effort stable</text>
  <text x="385" y="188" font-size="12" fill="#085041">across versions — prefer these first.</text>

  <!-- PMC group -->
  <rect x="195" y="250" width="330" height="130" rx="10" fill="none" stroke="#378ADD" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="210" y="240" font-size="13" font-weight="bold" fill="#0C447C">Hardware sampling</text>

  <rect x="270" y="270" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <text x="360" y="292" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">PMC / perf_event</text>
  <text x="360" y="310" text-anchor="middle" font-size="11" fill="#0C447C">CPU counter overflow</text>

  <text x="210" y="352" font-size="12" fill="#0C447C">Cache misses, IPC, stalls — invisible</text>
  <text x="210" y="370" font-size="12" fill="#0C447C">to any software-only counter.</text>

  <text x="20" y="410" font-size="11" fill="#888780">Rule of thumb (Ch. 2 / Ch. 12): try the stable, static option first; fall back to dynamic only when necessary.</text>
</svg>
