<svg width="720" height="380" viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Namespaces vs cgroups, and why there is no single container ID</title>
  <desc>Namespaces restrict what a process can see (PIDs, mounts, hostname); cgroups restrict what a process can use (CPU, memory, block I/O). A container is really just a combination of the two, with no single unified kernel identifier tying them together.</desc>
  <rect width="720" height="380" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">A "container" is not one kernel object (Ch. 15)</text>

  <!-- Namespaces box -->
  <rect x="40" y="55" width="290" height="180" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <text x="185" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">Namespaces</text>
  <text x="185" y="98" text-anchor="middle" font-size="11" fill="#0C447C">restrict what a process can SEE</text>
  <text x="70" y="124" font-size="11" fill="#0C447C">• pid — its own process list</text>
  <text x="70" y="144" font-size="11" fill="#0C447C">• mnt — visible mounts</text>
  <text x="70" y="164" font-size="11" fill="#0C447C">• uts — hostname</text>
  <text x="70" y="184" font-size="11" fill="#0C447C">• net, ipc, user, cgroup</text>
  <text x="185" y="212" text-anchor="middle" font-size="10" fill="#0C447C">tools read task-&gt;nsproxy-&gt;pid_ns...</text>

  <!-- Cgroups box -->
  <rect x="390" y="55" width="290" height="180" rx="10" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="535" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#712B13">cgroups</text>
  <text x="535" y="98" text-anchor="middle" font-size="11" fill="#712B13">restrict what a process can USE</text>
  <text x="420" y="124" font-size="11" fill="#712B13">• cpu — scheduling share/limit</text>
  <text x="420" y="144" font-size="11" fill="#712B13">• memory — hard/soft limits</text>
  <text x="420" y="164" font-size="11" fill="#712B13">• blkio — I/O throttling</text>
  <text x="420" y="184" font-size="11" fill="#712B13">• pids, devices, cpuset</text>
  <text x="535" y="212" text-anchor="middle" font-size="10" fill="#712B13">soft limits can bite before hardware does</text>

  <!-- Converging into "container" -->
  <defs>
    <marker id="arrow9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#73726c"/>
    </marker>
  </defs>
  <line x1="185" y1="235" x2="330" y2="280" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow9)"/>
  <line x1="535" y1="235" x2="390" y2="280" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow9)"/>

  <rect x="200" y="284" width="320" height="56" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/>
  <text x="360" y="306" text-anchor="middle" font-size="12" font-weight="bold" fill="#791F1F">"Container" = this combination —</text>
  <text x="360" y="324" text-anchor="middle" font-size="11" fill="#791F1F">no single kernel identifier ties them together</text>

  <text x="20" y="365" font-size="11" fill="#888780">This is why kubectl-trace has to derive $container_pid itself, rather than the kernel just supplying it.</text>
</svg>
