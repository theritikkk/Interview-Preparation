<svg width="760" height="520" viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>End-to-end network packet lifecycle, send and receive, with instrumentation points</title>
  <desc>A packet's path from the sending application through socket, TCP/UDP, IP, qdisc, and the driver to the NIC and across the network, then the mirrored receive path on the remote host, with representative kprobe, tracepoint, XDP, and TC instrumentation points marked. Not every hook sits directly in the packet's data path — XDP and TC specifically do; most BPF networking tools instead observe state changes alongside it.</desc>
  <rect width="760" height="520" fill="#ffffff"/>
  <text x="380" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Network packet lifecycle: send and receive (Ch. 10)</text>

  <defs>
    <marker id="arrowN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#73726c"/>
    </marker>
  </defs>

  <!-- LOCAL HOST band -->
  <text x="20" y="46" font-size="11" font-weight="bold" fill="#888780">SENDING HOST</text>
  <rect x="10" y="52" width="340" height="300" fill="#F7F6F2" stroke="#D8D6CC" stroke-width="1"/>

  <rect x="30" y="66" width="300" height="34" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="180" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#2C2C2A">Application — send()</text>
  <line x1="180" y1="100" x2="180" y2="116" stroke="#73726c" stroke-width="1.2" marker-end="url(#arrowN)"/>

  <rect x="30" y="120" width="300" height="34" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="180" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#712B13">Socket layer — soconnect, socketio</text>
  <line x1="180" y1="154" x2="180" y2="170" stroke="#73726c" stroke-width="1.2" marker-end="url(#arrowN)"/>

  <rect x="30" y="174" width="300" height="34" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="180" y="196" text-anchor="middle" font-size="11" font-weight="bold" fill="#085041">TCP/UDP — tcpconnect, tcplife</text>
  <line x1="180" y1="208" x2="180" y2="224" stroke="#73726c" stroke-width="1.2" marker-end="url(#arrowN)"/>

  <rect x="30" y="228" width="300" height="34" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="180" y="250" text-anchor="middle" font-size="11" fill="#085041">IP — ipecn</text>
  <line x1="180" y1="262" x2="180" y2="278" stroke="#73726c" stroke-width="1.2" marker-end="url(#arrowN)"/>

  <rect x="30" y="282" width="300" height="34" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="180" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#3C3489">qdisc (TC hook here) — qdisc-fq</text>

  <line x1="180" y1="316" x2="180" y2="336" stroke="#73726c" stroke-width="1.2" marker-end="url(#arrowN)"/>
  <rect x="30" y="340" width="300" height="34" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="180" y="362" text-anchor="middle" font-size="11" font-weight="bold" fill="#633806">Driver + NIC (XDP hook here) — nettxlat</text>

  <!-- middle: the physical network -->
  <line x1="330" y1="357" x2="420" y2="357" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowN)"/>
  <rect x="330" y="400" width="100" height="40" rx="20" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="380" y="424" text-anchor="middle" font-size="11" fill="#2C2C2A">network</text>

  <!-- REMOTE HOST band -->
  <text x="420" y="46" font-size="11" font-weight="bold" fill="#888780">RECEIVING HOST</text>
  <rect x="410" y="52" width="340" height="300" fill="#F7F6F2" stroke="#D8D6CC" stroke-width="1"/>

  <rect x="430" y="66" width="300" height="34" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="580" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#633806">NIC + driver (XDP hook here)</text>

  <line x1="580" y1="100" x2="580" y2="116" stroke="#73726c" stroke-width="1.2" marker-end="url(#arrowN)"/>
  <rect x="430" y="120" width="300" height="34" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="580" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#3C3489">qdisc / TC — netsize</text>

  <line x1="580" y1="154" x2="580" y2="170" stroke="#73726c" stroke-width="1.2" marker-end="url(#arrowN)"/>
  <rect x="430" y="174" width="300" height="34" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="580" y="196" text-anchor="middle" font-size="11" fill="#085041">IP — superping</text>

  <line x1="580" y1="208" x2="580" y2="224" stroke="#73726c" stroke-width="1.2" marker-end="url(#arrowN)"/>
  <rect x="430" y="228" width="300" height="34" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="580" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#085041">TCP/UDP — tcpaccept, tcpretrans</text>

  <line x1="580" y1="262" x2="580" y2="278" stroke="#73726c" stroke-width="1.2" marker-end="url(#arrowN)"/>
  <rect x="430" y="282" width="300" height="34" rx="6" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="580" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#712B13">Socket layer — soaccept</text>

  <line x1="580" y1="316" x2="580" y2="332" stroke="#73726c" stroke-width="1.2" marker-end="url(#arrowN)"/>
  <rect x="430" y="336" width="300" height="34" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="580" y="358" text-anchor="middle" font-size="11" font-weight="bold" fill="#2C2C2A">Application — recv()</text>

  <!-- caveat box -->
  <rect x="30" y="460" width="700" height="48" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/>
  <text x="380" y="480" text-anchor="middle" font-size="11" font-weight="bold" fill="#791F1F">Not every BPF hook sits directly in the packet's data path.</text>
  <text x="380" y="496" text-anchor="middle" font-size="10" fill="#791F1F">XDP and TC genuinely do. Most tracing tools shown here instead observe a state change alongside it (tracepoints, kprobes on TCP/socket functions).</text>
</svg>
