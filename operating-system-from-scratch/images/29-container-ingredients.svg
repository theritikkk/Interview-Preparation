<svg xmlns='http://www.w3.org/2000/svg' width='800' height='520' viewBox='0 0 800 520' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x='0' y='0' width='800' height='520' fill='#fdfdfc'/>
<defs><marker id='arrow' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L0,6 L9,3 z' fill='#3a4556'/></marker></defs>
<text x='400.0' y='24' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>A “Container” Is Not a Kernel Object — It's Three Existing Features, Combined</text>
<rect x='40.0' y='55' width='220' height='150' rx='6' fill='#eaf1fb' stroke='#4a6fa5' stroke-width='1.6'/>
<text x='150.0' y='79' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>Namespaces</text>
<text x='150.0' y='97' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10' font-weight='700' font-style='normal' text-anchor='middle' fill='#5b6472'>ISOLATION (what you can see)</text>
<text x='150.0' y='121' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>PID, mount, net, UTS,</text>
<text x='150.0' y='136' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>IPC, user namespaces —</text>
<text x='150.0' y='151' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>each gives a private VIEW</text>
<text x='150.0' y='166' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>of a global kernel resource</text>
<rect x='290.0' y='55' width='220' height='150' rx='6' fill='#fff2d9' stroke='#c9820a' stroke-width='1.6'/>
<text x='400.0' y='79' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>cgroups</text>
<text x='400.0' y='97' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10' font-weight='700' font-style='normal' text-anchor='middle' fill='#5b6472'>LIMITS (what you can use)</text>
<text x='400.0' y='121' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>caps and accounts for</text>
<text x='400.0' y='136' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>CPU, memory, I/O for a</text>
<text x='400.0' y='151' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>group of processes —</text>
<text x='400.0' y='166' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>a different job entirely</text>
<rect x='540.0' y='55' width='220' height='150' rx='6' fill='#e7f7ee' stroke='#2f9e5c' stroke-width='1.6'/>
<text x='650.0' y='79' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>overlayfs + pivot_root</text>
<text x='650.0' y='97' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10' font-weight='700' font-style='normal' text-anchor='middle' fill='#5b6472'>FILESYSTEM (what you can write)</text>
<text x='650.0' y='121' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>layered, read-only base</text>
<text x='650.0' y='136' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>+ a writable layer per</text>
<text x='650.0' y='151' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>container (file 18's ideas,</text>
<text x='650.0' y='166' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>union-mounted)</text>
<line x1='150.0' y1='205' x2='400.0' y2='235' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<line x1='400.0' y1='205' x2='400.0' y2='235' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<line x1='650.0' y1='205' x2='400.0' y2='235' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<rect x='260.0' y='235' width='280' height='50' rx='6' fill='#f1f1ef' stroke='#9a9a95' stroke-width='1.6'/>
<text x='400.0' y='257' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>“A container”</text>
<text x='400.0' y='275' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5b6472'>a userspace NAME for this combination</text>
<text x='400.0' y='320' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>runc / containerd / Docker assemble these three kernel features per-container,</text>
<text x='400.0' y='338' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>following the OCI spec. There is no struct container anywhere in the kernel source.</text>
<text x='400.0' y='375' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#c9820a'>All containers on one host still share ONE kernel — unlike file 28's VMs, which each get their own.</text>
</svg>
