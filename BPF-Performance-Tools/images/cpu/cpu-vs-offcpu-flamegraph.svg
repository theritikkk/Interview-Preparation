<svg width="720" height="340" viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>CPU flame graph vs off-CPU time flame graph</title>
  <desc>Side-by-side comparison: a CPU flame graph (warm colors) shows time actually executing on-CPU; an off-CPU time flame graph (blue) shows time blocked and waiting, with a different meaning for box width.</desc>
  <rect width="720" height="340" fill="#ffffff"/>

  <!-- Left: CPU flame graph -->
  <text x="180" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#712B13">CPU flame graph</text>
  <rect x="30" y="230" width="300" height="30" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <rect x="30" y="195" width="180" height="30" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <rect x="220" y="195" width="110" height="30" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <rect x="30" y="160" width="90" height="30" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text x="180" y="120" text-anchor="middle" font-size="12" fill="#633806">width = % of CPU samples</text>
  <text x="180" y="140" text-anchor="middle" font-size="12" fill="#633806">actively executing</text>

  <!-- Right: off-CPU flame graph -->
  <text x="540" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">Off-CPU time flame graph</text>
  <rect x="390" y="230" width="300" height="30" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <rect x="390" y="195" width="200" height="30" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <rect x="600" y="195" width="90" height="30" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <rect x="390" y="160" width="120" height="30" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="540" y="120" text-anchor="middle" font-size="12" fill="#0C447C">width = amount of time</text>
  <text x="540" y="140" text-anchor="middle" font-size="12" fill="#0C447C">blocked, not running</text>

  <!-- Bottom warning box -->
  <rect x="30" y="270" width="660" height="55" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/>
  <text x="360" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#791F1F">Same visual shape, opposite meaning</text>
  <text x="360" y="310" text-anchor="middle" font-size="11" fill="#791F1F">Deliberately color them differently (e.g. blue for off-CPU) so the two are never confused at a glance.</text>
</svg>
