<text x='380.0' y='24' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='15.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>A Packet's Path: File 01's Promise, Finally Paid Off</text>
<rect x='80.0' y='50' width='600' height='54' rx='6' fill='#f1f1ef' stroke='#9a9a95' stroke-width='1.6'/>
<text x='380.0' y='73' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>Electrical signal arrives at the NIC</text>
<text x='380.0' y='91' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5b6472'>hardware event</text>
<line x1='380.0' y1='104' x2='380.0' y2='116' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<rect x='80.0' y='116' width='600' height='54' rx='6' fill='#eaf1fb' stroke='#4a6fa5' stroke-width='1.6'/>
<text x='380.0' y='139' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>NIC DMAs the frame into a ring buffer</text>
<text x='380.0' y='157' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5b6472'>file 15</text>
<line x1='380.0' y1='170' x2='380.0' y2='182' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<rect x='80.0' y='182' width='600' height='54' rx='6' fill='#fff2d9' stroke='#c9820a' stroke-width='1.6'/>
<text x='380.0' y='205' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>NIC raises an interrupt (or NAPI keeps polling)</text>
<text x='380.0' y='223' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5b6472'>file 14, refined below</text>
<line x1='380.0' y1='236' x2='380.0' y2='248' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<rect x='80.0' y='248' width='600' height='54' rx='6' fill='#eaf1fb' stroke='#4a6fa5' stroke-width='1.6'/>
<text x='380.0' y='271' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>Driver hands the frame to the network stack</text>
<text x='380.0' y='289' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5b6472'>Ethernet → IP → TCP/UDP</text>
<line x1='380.0' y1='302' x2='380.0' y2='314' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<rect x='80.0' y='314' width='600' height='54' rx='6' fill='#e7f7ee' stroke='#2f9e5c' stroke-width='1.6'/>
<text x='380.0' y='337' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>Data lands in a socket's receive buffer</text>
<text x='380.0' y='355' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5b6472'>the socket a process is Waiting on</text>
<line x1='380.0' y1='368' x2='380.0' y2='380' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<rect x='80.0' y='380' width='600' height='54' rx='6' fill='#fff2d9' stroke='#c9820a' stroke-width='1.6'/>
<text x='380.0' y='403' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>Process wakes (file 19/20), read()/recv() runs</text>
<text x='380.0' y='421' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5b6472'>copy_to_user — file 21</text>
<line x1='380.0' y1='434' x2='380.0' y2='446' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<rect x='80.0' y='446' width='600' height='54' rx='6' fill='#e7f7ee' stroke='#2f9e5c' stroke-width='1.6'/>
<text x='380.0' y='469' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>Application has the bytes</text>
<text x='380.0' y='487' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5b6472'>done</text>
<text x='380.0' y='528' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>Sending is the same path in reverse: write()/send() → headers built → driver's transmit ring → DMA out.</text>
</svg>
