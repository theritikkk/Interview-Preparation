<svg width="760" height="320" viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Guest-visible observability shrinks as hypervisors move functionality into hardware</title>
  <desc>Across four hypervisor generations, from fully paravirtualized to AWS Nitro, each successive generation exposes fewer guest-traceable events, because improving virtualization performance means moving functionality out of guest-visible software and into hardware.</desc>
  <rect width="760" height="320" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Guest-visible tracing surface shrinks as virtualization matures (Ch. 16)</text>

  <!-- Four columns -->
  <rect x="20" y="50" width="170" height="210" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="105" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#085041">PV</text>
  <text x="105" y="96" text-anchor="middle" font-size="10" fill="#085041">✓ Hypercalls</text>
  <text x="105" y="116" text-anchor="middle" font-size="10" fill="#085041">✓ Callbacks</text>
  <text x="105" y="136" text-anchor="middle" font-size="10" fill="#085041">✓ Driver calls</text>
  <text x="105" y="156" text-anchor="middle" font-size="10" fill="#085041">✓ Stolen time</text>

  <rect x="210" y="50" width="170" height="210" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <text x="295" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#0C447C">PVHVM</text>
  <text x="295" y="96" text-anchor="middle" font-size="10" fill="#B4B2A9" text-decoration="line-through">Hypercalls</text>
  <text x="295" y="116" text-anchor="middle" font-size="10" fill="#0C447C">✓ Callbacks</text>
  <text x="295" y="136" text-anchor="middle" font-size="10" fill="#0C447C">✓ Driver calls</text>
  <text x="295" y="156" text-anchor="middle" font-size="10" fill="#0C447C">✓ Stolen time</text>

  <rect x="400" y="50" width="170" height="210" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="485" y="72" text-anchor="middle" font-size="11" font-weight="bold" fill="#633806">PVHVM + SR-IOV</text>
  <text x="485" y="96" text-anchor="middle" font-size="10" fill="#B4B2A9" text-decoration="line-through">Hypercalls</text>
  <text x="485" y="116" text-anchor="middle" font-size="10" fill="#633806">✓ Callbacks</text>
  <text x="485" y="136" text-anchor="middle" font-size="10" fill="#B4B2A9" text-decoration="line-through">Driver calls</text>
  <text x="485" y="156" text-anchor="middle" font-size="10" fill="#633806">✓ Stolen time</text>

  <rect x="590" y="50" width="150" height="210" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/>
  <text x="665" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#791F1F">KVM / Nitro</text>
  <text x="665" y="96" text-anchor="middle" font-size="10" fill="#B4B2A9" text-decoration="line-through">Hypercalls</text>
  <text x="665" y="116" text-anchor="middle" font-size="10" fill="#B4B2A9" text-decoration="line-through">Callbacks</text>
  <text x="665" y="136" text-anchor="middle" font-size="10" fill="#B4B2A9" text-decoration="line-through">Driver calls</text>
  <text x="665" y="156" text-anchor="middle" font-size="10" fill="#791F1F">✓ Stolen time only</text>

  <!-- Arrow across the bottom -->
  <defs>
    <marker id="arrowH" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#73726c"/>
    </marker>
  </defs>
  <line x1="20" y1="280" x2="730" y2="280" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowH)"/>
  <text x="380" y="300" text-anchor="middle" font-size="11" fill="#5F5E5A">more hardware-accelerated, better performance, less guest-visible software to trace</text>
</svg>
