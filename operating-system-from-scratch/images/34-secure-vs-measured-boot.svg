<svg xmlns='http://www.w3.org/2000/svg' width='820' height='500' viewBox='0 0 820 500' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x='0' y='0' width='820' height='500' fill='#fdfdfc'/>
<defs><marker id='arrow' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L0,6 L9,3 z' fill='#3a4556'/></marker></defs>
<text x='410.0' y='24' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>Secure Boot vs. Measured Boot: Prevention vs. Evidence</text>
<text x='200' y='55' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#c0392b'>SECURE BOOT  —  stops untrusted code from running</text>
<rect x='29.0' y='70' width='180' height='60' rx='6' fill='#fdecea' stroke='#c0392b' stroke-width='1.6'/>
<text x='119.0' y='92' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>Platform Key (PK)</text>
<text x='119.0' y='112' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='8.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>owned by the device maker</text>
<line x1='211.0' y1='100.0' x2='221.0' y2='100.0' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<rect x='223.0' y='70' width='180' height='60' rx='6' fill='#fdecea' stroke='#c0392b' stroke-width='1.6'/>
<text x='313.0' y='92' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>Key Exchange Key (KEK)</text>
<text x='313.0' y='112' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='8.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>signs updates to the next database</text>
<line x1='405.0' y1='100.0' x2='415.0' y2='100.0' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<rect x='417.0' y='70' width='180' height='60' rx='6' fill='#fdecea' stroke='#c0392b' stroke-width='1.6'/>
<text x='507.0' y='92' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>Signature DB (db / dbx)</text>
<text x='507.0' y='112' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='8.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>allowed and explicitly revoked signatures</text>
<line x1='599.0' y1='100.0' x2='609.0' y2='100.0' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<rect x='611.0' y='70' width='180' height='60' rx='6' fill='#fdecea' stroke='#c0392b' stroke-width='1.6'/>
<text x='701.0' y='92' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>Each boot stage's .efi file</text>
<text x='701.0' y='112' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='8.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>signature checked before it's allowed to run</text>
<text x='410.0' y='155' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>Any unsigned or revoked binary in this chain → boot refuses to continue at all.</text>
<text x='30' y='190' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='700' font-style='normal' text-anchor='start' fill='#2f9e5c'>MEASURED BOOT  —  records what ran, doesn't stop anything</text>
<rect x='29.0' y='205' width='180' height='60' rx='6' fill='#e7f7ee' stroke='#2f9e5c' stroke-width='1.6'/>
<text x='119.0' y='227' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>Firmware</text>
<text x='119.0' y='247' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='8.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>hashes itself into PCR0</text>
<line x1='211.0' y1='235.0' x2='221.0' y2='235.0' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<rect x='223.0' y='205' width='180' height='60' rx='6' fill='#e7f7ee' stroke='#2f9e5c' stroke-width='1.6'/>
<text x='313.0' y='227' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>Bootloader</text>
<text x='313.0' y='247' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='8.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>hashes itself into a PCR before running</text>
<line x1='405.0' y1='235.0' x2='415.0' y2='235.0' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<rect x='417.0' y='205' width='180' height='60' rx='6' fill='#e7f7ee' stroke='#2f9e5c' stroke-width='1.6'/>
<text x='507.0' y='227' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>Kernel + config</text>
<text x='507.0' y='247' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='8.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>hashed into another PCR</text>
<line x1='599.0' y1='235.0' x2='609.0' y2='235.0' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<rect x='611.0' y='205' width='180' height='60' rx='6' fill='#e7f7ee' stroke='#2f9e5c' stroke-width='1.6'/>
<text x='701.0' y='227' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>TPM holds the hashes</text>
<text x='701.0' y='247' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='8.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>tamper-evident, even if boot itself succeeded</text>
<text x='410.0' y='290' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>A remote party can later ask the TPM to attest what actually booted — even malicious-but-unsigned code still gets measured.</text>
<rect x='130.0' y='315' width='560' height='40' rx='6' fill='#fff2d9' stroke='#c9820a' stroke-width='1.6'/>
<text x='410.0' y='340' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>Used together in practice: Secure Boot stops most bad actors; measured boot catches what Secure Boot didn't.</text>
</svg>
