<svg width="720" height="420" viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>How to read a flame graph</title>
  <desc>A flame graph example: the y-axis is stack depth with the root at the bottom, the x-axis is an alphabetical sort (not time), and box width is proportional to the share of samples containing that frame.</desc>
  <rect width="720" height="420" fill="#ffffff"/>

  <!-- Y axis label -->
  <text x="30" y="60" font-size="12" fill="#5F5E5A">leaf frame</text>
  <text x="30" y="350" font-size="12" fill="#5F5E5A">root</text>
  <line x1="70" y1="45" x2="70" y2="360" stroke="#B4B2A9" stroke-width="1"/>
  <text x="55" y="200" font-size="12" fill="#5F5E5A" transform="rotate(-90 55 200)" text-anchor="middle">stack depth</text>

  <!-- Row 1 (root, bottom) -->
  <rect x="90" y="330" width="600" height="30" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="390" y="349" text-anchor="middle" font-size="12" fill="#085041">handleRequest (100% — every sample)</text>

  <!-- Row 2 -->
  <rect x="90" y="295" width="600" height="30" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="390" y="314" text-anchor="middle" font-size="12" fill="#085041">parseJSON (100% — called on every request)</text>

  <!-- Row 3: split into two children, widths proportional to samples -->
  <rect x="90" y="260" width="180" height="30" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="180" y="279" text-anchor="middle" font-size="12" fill="#633806">validateInput (30%)</text>

  <rect x="270" y="260" width="420" height="30" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text x="480" y="279" text-anchor="middle" font-size="12" fill="#712B13">lookupCache (70% — the widest box: look here first)</text>

  <!-- Row 4: child of lookupCache -->
  <rect x="270" y="225" width="420" height="30" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text x="480" y="244" text-anchor="middle" font-size="12" fill="#712B13">readFromDisk (70% of all samples)</text>

  <!-- X axis -->
  <line x1="90" y1="365" x2="690" y2="365" stroke="#B4B2A9" stroke-width="1"/>
  <text x="390" y="390" text-anchor="middle" font-size="12" fill="#5F5E5A">alphabetical sort to merge identical stacks — NOT time</text>

  <text x="20" y="30" font-size="13" font-weight="bold" fill="#2C2C2A">Width = share of samples. Read the widest towers first.</text>
</svg>
