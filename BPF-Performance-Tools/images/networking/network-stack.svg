<svg width="720" height="560" viewBox="0 0 720 560" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>The Linux networking stack</title>
  <desc>Layers a packet passes through: application, socket, TCP or UDP, IP, the queueing discipline, the device driver, and the network interface card, with the chapter that traces each layer.</desc>
  <rect width="720" height="560" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">The networking send/receive stack</text>

  <defs>
    <marker id="arrow7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#73726c"/>
    </marker>
  </defs>

  <!-- Application -->
  <rect x="180" y="50" width="360" height="50" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="360" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C2C2A">Application</text>
  <line x1="360" y1="100" x2="360" y2="126" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow7)"/>

  <!-- Socket layer -->
  <rect x="160" y="130" width="400" height="50" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="360" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#712B13">Socket syscalls — Ch. 10 Part 1</text>
  <line x1="360" y1="180" x2="360" y2="206" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow7)"/>

  <!-- TCP/UDP -->
  <rect x="140" y="210" width="440" height="60" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="360" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#085041">TCP or UDP — Ch. 10 Parts 2 &amp; 3</text>
  <text x="360" y="253" text-anchor="middle" font-size="11" fill="#085041">connection state, retransmits, congestion window</text>
  <line x1="360" y1="270" x2="360" y2="296" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow7)"/>

  <!-- IP -->
  <rect x="160" y="300" width="400" height="50" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="360" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#085041">IP / ICMP — Ch. 10 Part 3</text>
  <line x1="360" y1="350" x2="360" y2="376" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow7)"/>

  <!-- Qdisc -->
  <rect x="140" y="380" width="440" height="60" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="360" y="405" text-anchor="middle" font-size="13" font-weight="bold" fill="#3C3489">Queueing discipline (qdisc) — Ch. 10 Part 3</text>
  <text x="360" y="423" text-anchor="middle" font-size="11" fill="#3C3489">fq, fq_codel, tbf — classification, shaping</text>
  <line x1="360" y1="440" x2="360" y2="466" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow7)"/>

  <!-- Driver -->
  <rect x="160" y="470" width="400" height="40" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="360" y="495" text-anchor="middle" font-size="13" font-weight="bold" fill="#633806">Device driver + GSO/TSO offload — Ch. 10 Part 3</text>
  <line x1="360" y1="510" x2="360" y2="522" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow7)"/>

  <!-- NIC -->
  <rect x="220" y="526" width="280" height="28" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="360" y="545" text-anchor="middle" font-size="12" fill="#2C2C2A">Network interface card (physical or virtual)</text>
</svg>
