<svg xmlns='http://www.w3.org/2000/svg' width='800' height='480' viewBox='0 0 800 480' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x='0' y='0' width='800' height='480' fill='#fdfdfc'/>
<defs><marker id='arrow' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L0,6 L9,3 z' fill='#3a4556'/></marker></defs>
<text x='400.0' y='24' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='14.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>VMX: a New Privilege Dimension, Orthogonal to Rings 0–3</text>
<rect x='60' y='60' width='320' height='340' rx='6' fill='#fff2d9' stroke='#c9820a' stroke-width='1.6'/>
<text x='220.0' y='84' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>VMX root mode</text>
<text x='220.0' y='102' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5b6472'>the hypervisor (KVM)</text>
<rect x='90' y='130' width='260' height='50' rx='6' fill='#eaf1fb' stroke='#4a6fa5' stroke-width='1.6'/>
<text x='220.0' y='160.0' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='600' font-style='normal' text-anchor='middle' fill='#1a2233'>Ring 0: hypervisor kernel</text>
<text x='220.0' y='210' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>runs VMLAUNCH / VMRESUME</text>
<text x='220.0' y='230' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>to enter the guest</text>
<text x='220.0' y='280' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>on VM exit: reads the VMCS,</text>
<text x='220.0' y='298' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>emulates the sensitive op,</text>
<text x='220.0' y='316' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>resumes the guest</text>
<rect x='420' y='60' width='320' height='340' rx='6' fill='#e7f7ee' stroke='#2f9e5c' stroke-width='1.6'/>
<text x='580.0' y='84' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>VMX non-root mode</text>
<text x='580.0' y='102' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5b6472'>the guest — your toy OS, or Linux</text>
<rect x='450' y='130' width='260' height='44' rx='6' fill='#eaf1fb' stroke='#4a6fa5' stroke-width='1.6'/>
<text x='580.0' y='157.0' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='600' font-style='normal' text-anchor='middle' fill='#1a2233'>Guest ring 0: guest kernel</text>
<rect x='450' y='188' width='260' height='44' rx='6' fill='#eaf1fb' stroke='#4a6fa5' stroke-width='1.6'/>
<text x='580.0' y='215.0' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='600' font-style='normal' text-anchor='middle' fill='#1a2233'>Guest ring 3: guest apps</text>
<text x='580.0' y='255' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>ordinary instructions run at</text>
<text x='580.0' y='273' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>near-native hardware speed</text>
<text x='580.0' y='315' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='700' font-style='normal' text-anchor='middle' fill='#c0392b'>sensitive op (in/out, CR3 write,</text>
<text x='580.0' y='333' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='700' font-style='normal' text-anchor='middle' fill='#c0392b'>lgdt, cli...) → VM exit</text>
<line x1='416' y1='340' x2='384' y2='340' stroke='#c0392b' stroke-width='1.8'  marker-end='url(#arrow)'/>
<text x='400.0' y='332' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#c0392b'>VM exit (sensitive instruction)</text>
<line x1='384' y1='380' x2='416' y2='380' stroke='#2f9e5c' stroke-width='1.8'  marker-end='url(#arrow)'/>
<text x='400.0' y='396' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#2f9e5c'>VM entry (VMRESUME)</text>
<text x='400.0' y='435' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>The guest's ring 0 is real — unmodified guest kernels run natively — the CPU adds a second axis instead.</text>
<text x='400.0' y='453' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5b6472'>The VMCS (a descriptor-like structure, same idea as the GDT/IDT/TSS) says exactly which ops trigger an exit.</text>
</svg>
