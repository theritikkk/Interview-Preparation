<svg width="720" height="420" viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>A power-of-two histogram, illustrated</title>
  <desc>A representative example of the ASCII histogram output produced by hist() in bpftrace or print_log2_hist() in BCC, showing bucket ranges doubling in width and a distribution symbol bar for each.</desc>
  <rect width="720" height="420" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">hist() / print_log2_hist() output, illustrated</text>
  <text x="360" y="46" text-anchor="middle" font-size="11" fill="#5F5E5A">a representative biolatency(8)-style latency histogram (microseconds)</text>

  <!-- table header -->
  <rect x="40" y="60" width="640" height="26" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="55" y="78" font-size="11" font-weight="bold" fill="#2C2C2A">usecs range</text>
  <text x="250" y="78" font-size="11" font-weight="bold" fill="#2C2C2A">count</text>
  <text x="340" y="78" font-size="11" font-weight="bold" fill="#2C2C2A">distribution</text>

  <!-- rows: bucket label, count, bar -->
  <!-- row 1 -->
  <text x="55" y="104" font-size="11" fill="#2C2C2A">0 -&gt; 1</text>
  <text x="250" y="104" font-size="11" fill="#2C2C2A">2</text>
  <rect x="340" y="94" width="10" height="14" fill="#B5D4F4"/>

  <!-- row 2 -->
  <text x="55" y="128" font-size="11" fill="#2C2C2A">2 -&gt; 3</text>
  <text x="250" y="128" font-size="11" fill="#2C2C2A">14</text>
  <rect x="340" y="118" width="30" height="14" fill="#B5D4F4"/>

  <!-- row 3 -->
  <text x="55" y="152" font-size="11" fill="#2C2C2A">4 -&gt; 7</text>
  <text x="250" y="152" font-size="11" fill="#2C2C2A">210</text>
  <rect x="340" y="142" width="260" height="14" fill="#378ADD"/>
  <text x="605" y="152" font-size="10" fill="#0C447C">fast mode — cache hits</text>

  <!-- row 4 -->
  <text x="55" y="176" font-size="11" fill="#2C2C2A">8 -&gt; 15</text>
  <text x="250" y="176" font-size="11" fill="#2C2C2A">58</text>
  <rect x="340" y="166" width="70" height="14" fill="#B5D4F4"/>

  <!-- row 5 -->
  <text x="55" y="200" font-size="11" fill="#2C2C2A">16 -&gt; 31</text>
  <text x="250" y="200" font-size="11" fill="#2C2C2A">9</text>
  <rect x="340" y="190" width="16" height="14" fill="#B5D4F4"/>

  <!-- row 6 -->
  <text x="55" y="224" font-size="11" fill="#2C2C2A">32 -&gt; 63</text>
  <text x="250" y="224" font-size="11" fill="#2C2C2A">3</text>
  <rect x="340" y="214" width="8" height="14" fill="#B5D4F4"/>

  <!-- row 7: outlier -->
  <text x="55" y="248" font-size="11" fill="#2C2C2A">... 128 -&gt; 255</text>
  <text x="250" y="248" font-size="11" fill="#2C2C2A">1</text>
  <rect x="340" y="238" width="4" height="14" fill="#D85A30"/>
  <text x="605" y="248" font-size="10" fill="#712B13">rare outlier — worth chasing</text>

  <!-- explanatory box -->
  <rect x="40" y="280" width="640" height="110" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="60" y="304" font-size="12" font-weight="bold" fill="#633806">What to look for</text>
  <text x="60" y="326" font-size="11" fill="#633806">Modes — clusters of buckets with high counts (here: 4–7 μs, likely cache hits)</text>
  <text x="60" y="346" font-size="11" fill="#633806">Outliers — a handful of samples far past the rest of the distribution</text>
  <text x="60" y="366" font-size="11" fill="#633806">Bucket width doubles each row — this is what "power of two" means</text>
</svg>
