<svg width="760" height="340" viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>A real wakeup dependency chain: gzip waiting on tar waiting on disk</title>
  <desc>offcputime alone shows that gzip is blocked, but not why. wakeuptime shows gzip was woken by tar. Running offcputime again on tar shows it was blocked on real disk I/O. offwaketime fuses both halves into one view automatically.</desc>
  <rect width="760" height="340" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">A real wakeup chain: tar cf - /mnt/data | gzip - &gt; backup.tar.gz (Ch. 14)</text>

  <defs>
    <marker id="arrowW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#73726c"/>
    </marker>
  </defs>

  <!-- gzip box -->
  <rect x="470" y="50" width="240" height="60" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="590" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="#3C3489">gzip</text>
  <text x="590" y="92" text-anchor="middle" font-size="11" fill="#3C3489">blocked in pipe_read(), 4.4s</text>

  <!-- step 1 label -->
  <rect x="30" y="50" width="400" height="60" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/>
  <text x="230" y="70" text-anchor="middle" font-size="12" font-weight="bold" fill="#791F1F">Step 1 — offcputime on gzip</text>
  <text x="230" y="90" text-anchor="middle" font-size="11" fill="#791F1F">Shows IT'S blocked. Doesn't say why.</text>
  <line x1="430" y1="80" x2="466" y2="80" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowW)"/>

  <!-- tar box -->
  <rect x="470" y="150" width="240" height="60" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="590" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#3C3489">tar</text>
  <text x="590" y="192" text-anchor="middle" font-size="11" fill="#3C3489">writes to the pipe, waking gzip</text>

  <!-- step 2 -->
  <rect x="30" y="150" width="400" height="60" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="230" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#633806">Step 2 — wakeuptime on gzip</text>
  <text x="230" y="190" text-anchor="middle" font-size="11" fill="#633806">Shows WHO woke it: tar, via vfs_write()</text>
  <line x1="430" y1="180" x2="466" y2="180" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowW)"/>

  <!-- disk box -->
  <rect x="470" y="250" width="240" height="60" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="590" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C2C2A">Disk I/O</text>
  <text x="590" y="292" text-anchor="middle" font-size="11" fill="#2C2C2A">tar itself blocked in io_schedule()</text>

  <!-- step 3 -->
  <rect x="30" y="250" width="400" height="60" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="230" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#085041">Step 3 — offcputime on tar</text>
  <text x="230" y="290" text-anchor="middle" font-size="11" fill="#085041">Completes the chain: real root cause</text>
  <line x1="430" y1="280" x2="466" y2="280" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowW)"/>

  <text x="590" y="330" text-anchor="middle" font-size="11" font-style="italic" fill="#5F5E5A">offwaketime fuses steps 1+2 into one tool, automatically, for any trace</text>
</svg>
