<svg width="720" height="340" viewBox="0 0 720 340" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>A file system read, branching on page cache hit or miss</title>
  <desc>A read syscall reaches the VFS, which checks the page cache. On a hit, data returns immediately with no physical I/O. On a miss, the request continues down through the concrete file system and block layer to the actual storage device.</desc>
  <rect width="720" height="340" fill="#ffffff"/>
  <text x="360" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Where a read actually goes: cache hit vs. cache miss (Ch. 8 §8.1, cachestat)</text>

  <defs>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#73726c"/>
    </marker>
  </defs>

  <!-- read() -->
  <rect x="280" y="40" width="160" height="46" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="360" y="68" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C2C2A">read(2)</text>
  <line x1="360" y1="86" x2="360" y2="112" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowC)"/>

  <!-- VFS / page cache check -->
  <rect x="230" y="116" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="360" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#633806">VFS checks the page cache</text>
  <text x="360" y="156" text-anchor="middle" font-size="10" fill="#633806">cachestat measures the hit ratio here</text>

  <!-- branch: hit -->
  <line x1="300" y1="172" x2="180" y2="216" stroke="#1D9E75" stroke-width="1.8" marker-end="url(#arrowC)"/>
  <text x="200" y="195" font-size="11" fill="#085041" font-weight="bold">HIT</text>
  <rect x="40" y="220" width="240" height="60" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="160" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#085041">Returned from memory</text>
  <text x="160" y="262" text-anchor="middle" font-size="10" fill="#085041">no physical I/O — fast, cheap</text>

  <!-- branch: miss -->
  <line x1="420" y1="172" x2="540" y2="216" stroke="#D85A30" stroke-width="1.8" marker-end="url(#arrowC)"/>
  <text x="520" y="195" font-size="11" fill="#712B13" font-weight="bold">MISS</text>
  <rect x="440" y="220" width="240" height="60" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="560" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#712B13">ext4 / xfs → block layer</text>
  <text x="560" y="262" text-anchor="middle" font-size="10" fill="#712B13">real disk I/O — see Ch. 9 for the rest</text>

  <!-- note on why this matters -->
  <rect x="120" y="296" width="480" height="36" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/>
  <text x="360" y="318" text-anchor="middle" font-size="11" fill="#791F1F">Moving the hit ratio from 90% to 95% is a bigger win than "5%" suggests — misses cost far more than hits</text>
</svg>
