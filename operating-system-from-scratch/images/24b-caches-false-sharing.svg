<text x='400.0' y='302' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>A coherence protocol (MESI and relatives) keeps every core's copy of a cache line consistent.</text>
<text x='400.0' y='335' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='13.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#c0392b'>False sharing: two variables, one 64-byte cache line</text>
