<svg width="720" height="616" viewBox="0 0 720 616" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>The BPF program pipeline</title>
  <desc>Flow diagram: an event source triggers a BPF program, which is checked by the verifier, compiled by the JIT, runs in the kernel using helper functions, stores results in BPF maps, and is read from user space.</desc>
  <rect width="720" height="616" fill="#ffffff"/>
  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#73726c"/>
    </marker>
  </defs>

  <!-- Box 1: Event source -->
  <rect x="200" y="40" width="320" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="360" y="62" text-anchor="middle" font-size="14" font-weight="bold" fill="#712B13">Event source fires</text>
  <text x="360" y="80" text-anchor="middle" font-size="12" fill="#712B13">kprobe · uprobe · tracepoint · USDT · PMC</text>
  <line x1="360" y1="96" x2="360" y2="132" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <!-- Box 2: Verifier -->
  <rect x="245" y="136" width="230" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="360" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Verifier</text>
  <text x="360" y="176" text-anchor="middle" font-size="12" fill="#2C2C2A">Rejects unsafe programs</text>
  <line x1="360" y1="192" x2="360" y2="228" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <!-- Box 3: JIT -->
  <rect x="220" y="232" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="360" y="254" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">JIT compiler</text>
  <text x="360" y="272" text-anchor="middle" font-size="12" fill="#2C2C2A">Bytecode compiled to native machine code</text>
  <line x1="360" y1="288" x2="360" y2="324" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <!-- Box 4: Running in kernel -->
  <rect x="225" y="328" width="270" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <text x="360" y="350" text-anchor="middle" font-size="14" font-weight="bold" fill="#0C447C">Runs in the kernel</text>
  <text x="360" y="368" text-anchor="middle" font-size="12" fill="#0C447C">Reads state via bpf_* helper functions</text>
  <line x1="360" y1="384" x2="360" y2="420" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <!-- Box 5: Maps -->
  <rect x="190" y="424" width="340" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="360" y="446" text-anchor="middle" font-size="14" font-weight="bold" fill="#3C3489">BPF maps</text>
  <text x="360" y="464" text-anchor="middle" font-size="12" fill="#3C3489">In-kernel storage: hash, array, histogram, per-CPU</text>
  <line x1="360" y1="480" x2="360" y2="516" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow1)"/>

  <!-- Box 6: User space -->
  <rect x="190" y="520" width="340" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="360" y="542" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">User space</text>
  <text x="360" y="560" text-anchor="middle" font-size="12" fill="#085041">bpftrace / BCC reads the finished summary</text>

  <!-- Side annotation -->
  <text x="20" y="608" font-size="11" fill="#888780">Only the finished summary crosses into user space — not each raw event.</text>
</svg>
