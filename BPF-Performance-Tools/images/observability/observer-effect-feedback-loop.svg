<svg width="760" height="440" viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>The observer effect and the feedback-loop failure mode</title>
  <desc>Normally, tracing a workload adds a bounded amount of overhead. A feedback loop happens when a tracer's own activity (writing output, generating traffic) re-triggers the very event it is tracing, causing the event rate to escalate rather than stay bounded.</desc>
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Normal overhead vs. a feedback loop (Ch. 18 §18.11-18.12)</text>

  <defs>
    <marker id="arrowF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#73726c"/>
    </marker>
  </defs>

  <!-- Normal case: linear chain -->
  <text x="20" y="55" font-size="12" font-weight="bold" fill="#085041">Normal: bounded overhead</text>
  <rect x="20" y="65" width="150" height="46" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="95" y="93" text-anchor="middle" font-size="11" fill="#2C2C2A">Workload</text>
  <line x1="170" y1="88" x2="200" y2="88" stroke="#73726c" stroke-width="1.3" marker-end="url(#arrowF)"/>
  <rect x="204" y="65" width="150" height="46" rx="6" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="279" y="93" text-anchor="middle" font-size="11" fill="#085041">Instrumentation</text>
  <line x1="354" y1="88" x2="384" y2="88" stroke="#73726c" stroke-width="1.3" marker-end="url(#arrowF)"/>
  <rect x="388" y="65" width="150" height="46" rx="6" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="463" y="93" text-anchor="middle" font-size="11" fill="#3C3489">Overhead (Freq × Action / CPUs)</text>
  <line x1="538" y1="88" x2="568" y2="88" stroke="#73726c" stroke-width="1.3" marker-end="url(#arrowF)"/>
  <rect x="572" y="65" width="150" height="46" rx="6" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="647" y="93" text-anchor="middle" font-size="11" fill="#2C2C2A">Measurement</text>

  <!-- Feedback loop case -->
  <text x="20" y="160" font-size="12" font-weight="bold" fill="#791F1F">Feedback loop: unbounded, escalating</text>

  <rect x="260" y="180" width="240" height="56" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/>
  <text x="380" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#791F1F">Tool traces event X</text>
  <text x="380" y="220" text-anchor="middle" font-size="11" fill="#791F1F">e.g. tcp_sendmsg() over SSH</text>

  <line x1="380" y1="236" x2="380" y2="270" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowF)"/>
  <rect x="260" y="274" width="240" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="380" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#633806">Tool prints output</text>
  <text x="380" y="314" text-anchor="middle" font-size="11" fill="#633806">output must travel back over SSH</text>

  <path d="M 500,302 C 600,302 620,220 500,208" fill="none" stroke="#791F1F" stroke-width="1.8" marker-end="url(#arrowF)"/>
  <text x="650" y="255" font-size="11" fill="#791F1F" text-anchor="middle">that traffic IS</text>
  <text x="650" y="270" font-size="11" fill="#791F1F" text-anchor="middle">event X again</text>

  <rect x="200" y="368" width="360" height="48" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="2"/>
  <text x="380" y="388" text-anchor="middle" font-size="12" font-weight="bold" fill="#791F1F">Event rate escalates — not a bug in the event,</text>
  <text x="380" y="404" text-anchor="middle" font-size="11" fill="#791F1F">a loop in what you chose to trace</text>
</svg>
