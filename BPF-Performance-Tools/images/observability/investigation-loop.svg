<svg width="760" height="460" viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>The performance investigation loop: how Chapter 3's four methodologies fit together</title>
  <desc>A repeatable cycle: state the goal, characterize the workload, apply the USE method across every resource, drill down into whatever looks abnormal, and use a checklist to make the whole process repeatable by someone less experienced.</desc>
  <rect width="760" height="460" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">The investigation loop (Ch. 3)</text>

  <defs>
    <marker id="arrowI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#73726c"/>
    </marker>
  </defs>

  <!-- Step 1: Goal -->
  <rect x="300" y="50" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="380" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C2C2A">State the goal</text>
  <text x="380" y="90" text-anchor="middle" font-size="10" fill="#2C2C2A">latency or cost?</text>
  <line x1="380" y1="106" x2="380" y2="134" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowI)"/>

  <!-- Step 2: Workload characterization -->
  <rect x="280" y="138" width="200" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="380" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#712B13">Workload characterization</text>
  <text x="380" y="178" text-anchor="middle" font-size="10" fill="#712B13">who, why, what, how much</text>
  <line x1="380" y1="194" x2="380" y2="222" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowI)"/>

  <!-- Step 3: USE method -->
  <rect x="260" y="226" width="240" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <text x="380" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#0C447C">USE method, every resource</text>
  <text x="380" y="266" text-anchor="middle" font-size="10" fill="#0C447C">Utilization · Saturation · Errors</text>
  <line x1="380" y1="282" x2="380" y2="310" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowI)"/>

  <!-- Step 4: Drill-down -->
  <rect x="280" y="314" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="380" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#3C3489">Drill-down analysis</text>
  <text x="380" y="354" text-anchor="middle" font-size="10" fill="#3C3489">repeat: decompose the biggest piece</text>

  <!-- loop back arrow (drill-down can reveal a new resource to USE-check) -->
  <path d="M 280,342 Q 120,342 120,254 Q 120,180 260,254" fill="none" stroke="#73726c" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrowI)"/>
  <text x="60" y="254" font-size="10" fill="#5F5E5A" text-anchor="middle" transform="rotate(-90 60 254)">reveals a new resource to check</text>

  <!-- Step 5: Root cause -->
  <line x1="380" y1="370" x2="380" y2="398" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowI)"/>
  <rect x="280" y="402" width="200" height="46" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="380" y="430" text-anchor="middle" font-size="12" font-weight="bold" fill="#085041">Root cause found, fix applied</text>

  <!-- Checklist side note -->
  <rect x="540" y="138" width="190" height="144" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="635" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#633806">Checklists</text>
  <text x="635" y="180" text-anchor="middle" font-size="10" fill="#633806">package a dozen tools +</text>
  <text x="635" y="196" text-anchor="middle" font-size="10" fill="#633806">how to read them, so this</text>
  <text x="635" y="212" text-anchor="middle" font-size="10" fill="#633806">whole loop can be run by</text>
  <text x="635" y="228" text-anchor="middle" font-size="10" fill="#633806">someone less experienced —</text>
  <text x="635" y="244" text-anchor="middle" font-size="10" fill="#633806">this is how expertise scales</text>
  <text x="635" y="264" text-anchor="middle" font-size="10" fill="#633806">(Ch. 3's own 60-second +</text>
  <text x="635" y="278" text-anchor="middle" font-size="10" fill="#633806">BCC checklists)</text>
</svg>
