<svg xmlns='http://www.w3.org/2000/svg' width='820' height='420' viewBox='0 0 820 420' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x='0' y='0' width='820' height='420' fill='#fdfdfc'/>
<defs><marker id='arrow' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L0,6 L9,3 z' fill='#3a4556'/></marker></defs>
<text x='410.0' y='26' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='15' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>Why the PIC Must Be Remapped (BEYOND THE BOOK)</text>
<text x='410.0' y='55' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#c0392b'>DEFAULT (unsafe): hardware IRQs collide with CPU exceptions</text>
<rect x='60' y='70' width='320' height='140' rx='6' fill='#fdecea' stroke='#c0392b' stroke-width='1.6'/>
<text x='220' y='90' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>CPU exception vectors 0-31</text>
<text x='75' y='110' font-family='Consolas,Menlo,Monaco,monospace' font-size='11' font-weight='700' font-style='normal' text-anchor='start' fill='#1a2233'>0</text>
<text x='105' y='110' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='start' fill='#1a2233'>Divide error</text>
<text x='75' y='134' font-family='Consolas,Menlo,Monaco,monospace' font-size='11' font-weight='700' font-style='normal' text-anchor='start' fill='#1a2233'>8</text>
<text x='105' y='134' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='start' fill='#1a2233'>Double fault</text>
<text x='75' y='158' font-family='Consolas,Menlo,Monaco,monospace' font-size='11' font-weight='700' font-style='normal' text-anchor='start' fill='#1a2233'>13</text>
<text x='105' y='158' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='start' fill='#1a2233'>General protection</text>
<text x='75' y='182' font-family='Consolas,Menlo,Monaco,monospace' font-size='11' font-weight='700' font-style='normal' text-anchor='start' fill='#1a2233'>14</text>
<text x='105' y='182' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='start' fill='#1a2233'>Page fault</text>
<rect x='440' y='70' width='320' height='140' rx='6' fill='#fdecea' stroke='#c0392b' stroke-width='1.6'/>
<text x='600' y='90' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>IRQ0-7 default vectors (8-15)</text>
<text x='455' y='110' font-family='Consolas,Menlo,Monaco,monospace' font-size='11' font-weight='700' font-style='normal' text-anchor='start' fill='#c0392b'>8</text>
<text x='485' y='110' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='start' fill='#1a2233'>IRQ0 — timer</text>
<text x='455' y='134' font-family='Consolas,Menlo,Monaco,monospace' font-size='11' font-weight='700' font-style='normal' text-anchor='start' fill='#c0392b'>9</text>
<text x='485' y='134' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='start' fill='#1a2233'>IRQ1 — keyboard</text>
<text x='455' y='158' font-family='Consolas,Menlo,Monaco,monospace' font-size='11' font-weight='700' font-style='normal' text-anchor='start' fill='#c0392b'>13</text>
<text x='485' y='158' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='start' fill='#1a2233'>IRQ5 — (varies)</text>
<text x='455' y='182' font-family='Consolas,Menlo,Monaco,monospace' font-size='11' font-weight='700' font-style='normal' text-anchor='start' fill='#c0392b'>14</text>
<text x='485' y='182' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='start' fill='#1a2233'>IRQ6 — floppy</text>
<text x='410.0' y='235' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#c0392b'>vectors 8, 13, 14 mean two completely different things at once — unusable</text>
<text x='410.0' y='275' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#2f9e5c'>REMAPPED: PIC reprogrammed to use vectors 32-47 instead</text>
<rect x='60' y='290' width='320' height='90' rx='6' fill='#e7f7ee' stroke='#2f9e5c' stroke-width='1.6'/>
<text x='220' y='310' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>CPU exceptions</text>
<text x='220' y='335' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>still 0-31, untouched</text>
<rect x='440' y='290' width='320' height='90' rx='6' fill='#e7f7ee' stroke='#2f9e5c' stroke-width='1.6'/>
<text x='600' y='310' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>IRQ0-7 → vectors 32-39</text>
<text x='600' y='335' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>IRQ8-15 → vectors 40-47</text>
<text x='410.0' y='405' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5b6472'>Done by writing to the PIC's command/data I/O ports (file 15) during setup — before any IRQ is unmasked.</text>
</svg>
