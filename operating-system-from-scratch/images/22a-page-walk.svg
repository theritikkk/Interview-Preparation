<text x='519.0' y='188' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10' font-weight='normal' font-style='normal' text-anchor='end' fill='#2f9e5c'>selects PTE</text>
<text x='731.0' y='188' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10' font-weight='normal' font-style='normal' text-anchor='start' fill='#c9820a'>byte within frame</text>
<text x='410.0' y='320' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>x86-64 does the same walk with four levels (9+9+9+9 index bits + 12 offset) instead of two.</text>
<text x='410.0' y='338' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5b6472'>The MMU performs every walk in hardware; the TLB caches recent results so most accesses skip it.</text>
