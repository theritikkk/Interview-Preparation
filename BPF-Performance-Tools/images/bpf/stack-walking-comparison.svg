<svg width="720" height="380" viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Four stack-walking techniques compared</title>
  <desc>Frame pointers, DWARF debuginfo, LBR hardware records, and ORC compared on cost, accuracy, and whether BPF can use them for kernel or user-level stacks.</desc>
  <rect width="720" height="380" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Stack-walking techniques (Ch. 2 §2.4)</text>

  <!-- header row -->
  <rect x="20" y="45" width="150" height="34" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <rect x="170" y="45" width="140" height="34" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <rect x="310" y="45" width="140" height="34" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <rect x="450" y="45" width="130" height="34" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <rect x="580" y="45" width="120" height="34" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="95" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C2C2A">Technique</text>
  <text x="240" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C2C2A">Cost</text>
  <text x="380" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C2C2A">Accurate?</text>
  <text x="515" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C2C2A">BPF: kernel</text>
  <text x="640" y="66" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C2C2A">BPF: user</text>

  <!-- Row: Frame pointer -->
  <rect x="20" y="79" width="150" height="60" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <rect x="170" y="79" width="140" height="60" fill="#ffffff" stroke="#888780" stroke-width="0.5"/>
  <rect x="310" y="79" width="140" height="60" fill="#ffffff" stroke="#888780" stroke-width="0.5"/>
  <rect x="450" y="79" width="130" height="60" fill="#ffffff" stroke="#888780" stroke-width="0.5"/>
  <rect x="580" y="79" width="120" height="60" fill="#ffffff" stroke="#888780" stroke-width="0.5"/>
  <text x="95" y="113" text-anchor="middle" font-size="12" font-weight="bold" fill="#085041">Frame pointer</text>
  <text x="240" y="105" text-anchor="middle" font-size="11" fill="#2C2C2A">Cheap</text>
  <text x="240" y="122" text-anchor="middle" font-size="11" fill="#2C2C2A">simple linked list</text>
  <text x="380" y="105" text-anchor="middle" font-size="11" fill="#2C2C2A">Only if compiled</text>
  <text x="380" y="122" text-anchor="middle" font-size="11" fill="#2C2C2A">with -fno-omit-fp</text>
  <text x="515" y="113" text-anchor="middle" font-size="11" fill="#2C2C2A">Yes</text>
  <text x="640" y="113" text-anchor="middle" font-size="11" fill="#2C2C2A">Yes</text>

  <!-- Row: DWARF -->
  <rect x="20" y="139" width="150" height="60" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <rect x="170" y="139" width="140" height="60" fill="#ffffff" stroke="#888780" stroke-width="0.5"/>
  <rect x="310" y="139" width="140" height="60" fill="#ffffff" stroke="#888780" stroke-width="0.5"/>
  <rect x="450" y="139" width="130" height="60" fill="#ffffff" stroke="#888780" stroke-width="0.5"/>
  <rect x="580" y="139" width="120" height="60" fill="#ffffff" stroke="#888780" stroke-width="0.5"/>
  <text x="95" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#712B13">DWARF debuginfo</text>
  <text x="240" y="165" text-anchor="middle" font-size="11" fill="#2C2C2A">Expensive</text>
  <text x="240" y="182" text-anchor="middle" font-size="11" fill="#2C2C2A">large files, slow</text>
  <text x="380" y="173" text-anchor="middle" font-size="11" fill="#2C2C2A">Yes, always</text>
  <text x="515" y="173" text-anchor="middle" font-size="11" fill="#791F1F">No</text>
  <text x="640" y="173" text-anchor="middle" font-size="11" fill="#791F1F">No</text>

  <!-- Row: LBR -->
  <rect x="20" y="199" width="150" height="60" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <rect x="170" y="199" width="140" height="60" fill="#ffffff" stroke="#888780" stroke-width="0.5"/>
  <rect x="310" y="199" width="140" height="60" fill="#ffffff" stroke="#888780" stroke-width="0.5"/>
  <rect x="450" y="199" width="130" height="60" fill="#ffffff" stroke="#888780" stroke-width="0.5"/>
  <rect x="580" y="199" width="120" height="60" fill="#ffffff" stroke="#888780" stroke-width="0.5"/>
  <text x="95" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="#0C447C">LBR (hardware)</text>
  <text x="240" y="225" text-anchor="middle" font-size="11" fill="#2C2C2A">Free</text>
  <text x="240" y="242" text-anchor="middle" font-size="11" fill="#2C2C2A">zero overhead</text>
  <text x="380" y="225" text-anchor="middle" font-size="11" fill="#2C2C2A">Shallow</text>
  <text x="380" y="242" text-anchor="middle" font-size="11" fill="#2C2C2A">4–32 frames only</text>
  <text x="515" y="233" text-anchor="middle" font-size="11" fill="#791F1F">No</text>
  <text x="640" y="233" text-anchor="middle" font-size="11" fill="#791F1F">No</text>

  <!-- Row: ORC -->
  <rect x="20" y="259" width="150" height="60" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <rect x="170" y="259" width="140" height="60" fill="#ffffff" stroke="#888780" stroke-width="0.5"/>
  <rect x="310" y="259" width="140" height="60" fill="#ffffff" stroke="#888780" stroke-width="0.5"/>
  <rect x="450" y="259" width="130" height="60" fill="#ffffff" stroke="#888780" stroke-width="0.5"/>
  <rect x="580" y="259" width="120" height="60" fill="#ffffff" stroke="#888780" stroke-width="0.5"/>
  <text x="95" y="293" text-anchor="middle" font-size="12" font-weight="bold" fill="#633806">ORC</text>
  <text x="240" y="285" text-anchor="middle" font-size="11" fill="#2C2C2A">Cheaper than</text>
  <text x="240" y="302" text-anchor="middle" font-size="11" fill="#2C2C2A">DWARF</text>
  <text x="380" y="293" text-anchor="middle" font-size="11" fill="#2C2C2A">Yes, always</text>
  <text x="515" y="293" text-anchor="middle" font-size="11" fill="#085041">Yes</text>
  <text x="640" y="293" text-anchor="middle" font-size="11" fill="#791F1F">Not yet</text>

  <text x="20" y="345" font-size="11" fill="#888780">As of this book's writing: BPF is frame-pointer-only for user stacks, and frame-pointer or ORC for kernel stacks.</text>
  <text x="20" y="362" font-size="11" fill="#888780">This is why -fno-omit-frame-pointer / -XX:+PreserveFramePointer recur throughout the book.</text>
</svg>
