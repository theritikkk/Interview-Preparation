<svg width="720" height="460" viewBox="0 0 720 460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>The entry/return timestamp-pair idiom</title>
  <desc>The most common pattern in the book: a kprobe on function entry stores a timestamp keyed by thread ID; a kretprobe on return computes the elapsed time, adds it to a histogram, and deletes the stored entry.</desc>
  <rect width="720" height="460" fill="#ffffff"/>

  <text x="360" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Timing vfs_read() — the pattern behind most latency tools in this book</text>

  <!-- Entry box -->
  <rect x="60" y="60" width="280" height="70" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="200" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#712B13">kprobe:vfs_read (entry)</text>
  <text x="200" y="103" text-anchor="middle" font-size="11" fill="#712B13">@start[tid] = nsecs;</text>
  <text x="200" y="120" text-anchor="middle" font-size="11" fill="#712B13">store a timestamp, keyed by tid</text>

  <!-- Arrow down to map -->
  <defs>
    <marker id="arrow5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#73726c"/>
    </marker>
  </defs>
  <line x1="200" y1="130" x2="200" y2="180" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow5)"/>

  <!-- Map box -->
  <rect x="60" y="184" width="280" height="60" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="200" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#3C3489">@start map</text>
  <text x="200" y="226" text-anchor="middle" font-size="11" fill="#3C3489">tid → entry timestamp</text>

  <!-- Arrow right into return box -->
  <line x1="340" y1="214" x2="390" y2="214" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow5)"/>
  <text x="365" y="204" text-anchor="middle" font-size="10" fill="#5F5E5A">read back</text>

  <!-- Return box -->
  <rect x="390" y="184" width="280" height="90" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="530" y="208" text-anchor="middle" font-size="13" font-weight="bold" fill="#085041">kretprobe:vfs_read (return)</text>
  <text x="530" y="226" text-anchor="middle" font-size="11" fill="#085041">if (@start[tid]) {</text>
  <text x="530" y="242" text-anchor="middle" font-size="11" fill="#085041">@ns = hist(nsecs - @start[tid]);</text>
  <text x="530" y="258" text-anchor="middle" font-size="11" fill="#085041">delete(@start[tid]); }</text>

  <!-- Arrow down from map to filter check -->
  <line x1="200" y1="244" x2="200" y2="300" stroke="#73726c" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="200" y1="300" x2="500" y2="300" stroke="#73726c" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="500" y1="300" x2="500" y2="270" stroke="#73726c" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow5)"/>

  <!-- Filter warning box -->
  <rect x="140" y="310" width="440" height="60" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="360" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#633806">Why the "if" check matters</text>
  <text x="360" y="350" text-anchor="middle" font-size="11" fill="#633806">A return with no matching entry reads a zero-initialized default —</text>
  <text x="360" y="365" text-anchor="middle" font-size="11" fill="#633806">skipping the check produces an absurd "duration" (Ch. 5 §5.17.1)</text>

  <!-- Final histogram output -->
  <line x1="530" y1="274" x2="530" y2="400" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow5)"/>
  <rect x="410" y="404" width="240" height="46" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="530" y="432" text-anchor="middle" font-size="12" fill="#2C2C2A">@ns histogram, printed at exit</text>

  <text x="20" y="450" font-size="11" fill="#888780">Same shape, everywhere: kprobe stores state keyed by an identifier; kretprobe consumes and cleans it up.</text>
</svg>
