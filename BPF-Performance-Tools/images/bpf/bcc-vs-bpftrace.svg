<svg width="720" height="400" viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>BCC and bpftrace: two front ends, one underlying engine</title>
  <desc>Both BCC and bpftrace compile down to BPF bytecode via LLVM and run on the same kernel verifier and JIT. BCC favors complex, option-rich tools written in C plus Python; bpftrace favors short, concise one-liners in its own high-level language.</desc>
  <rect width="720" height="400" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Two front ends, one underlying engine (Ch. 4 / Ch. 5)</text>

  <!-- BCC box -->
  <rect x="40" y="55" width="290" height="140" rx="10" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="185" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#3C3489">BCC</text>
  <text x="185" y="100" text-anchor="middle" font-size="11" fill="#3C3489">Kernel logic in C,</text>
  <text x="185" y="116" text-anchor="middle" font-size="11" fill="#3C3489">control/CLI in Python</text>
  <text x="185" y="140" text-anchor="middle" font-size="11" fill="#3C3489">Best for: rich CLIs,</text>
  <text x="185" y="156" text-anchor="middle" font-size="11" fill="#3C3489">long-running daemons</text>
  <text x="185" y="178" text-anchor="middle" font-size="11" fill="#3C3489">~10x the code of bpftrace</text>

  <!-- bpftrace box -->
  <rect x="390" y="55" width="290" height="140" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="535" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">bpftrace</text>
  <text x="535" y="100" text-anchor="middle" font-size="11" fill="#085041">One concise, purpose-built</text>
  <text x="535" y="116" text-anchor="middle" font-size="11" fill="#085041">high-level language</text>
  <text x="535" y="140" text-anchor="middle" font-size="11" fill="#085041">Best for: one-liners,</text>
  <text x="535" y="156" text-anchor="middle" font-size="11" fill="#085041">short ad hoc scripts</text>
  <text x="535" y="178" text-anchor="middle" font-size="11" fill="#085041">Fast to write, fast to run</text>

  <!-- Converging arrows -->
  <defs>
    <marker id="arrow8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#73726c"/>
    </marker>
  </defs>
  <line x1="185" y1="195" x2="330" y2="240" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow8)"/>
  <line x1="535" y1="195" x2="390" y2="240" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrow8)"/>

  <!-- Shared LLVM/BPF box -->
  <rect x="210" y="244" width="300" height="60" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="360" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C2C2A">LLVM compiles both to BPF bytecode</text>
  <text x="360" y="286" text-anchor="middle" font-size="11" fill="#2C2C2A">verified and JIT'd by the same kernel</text>

  <text x="360" y="330" text-anchor="middle" font-size="12" fill="#5F5E5A">Default workflow: prototype in bpftrace, "graduate" to BCC only if you need its extra capabilities.</text>
</svg>
