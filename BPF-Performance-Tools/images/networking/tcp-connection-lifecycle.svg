<svg width="760" height="320" viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>TCP connection state lifecycle and the tool that observes each stage</title>
  <desc>A simplified passive-connection lifecycle from SYN backlog through established to close, with tcpsynbl, tcpaccept, tcplife, and tcpretrans mapped onto the relevant stages.</desc>
  <rect width="760" height="320" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">TCP connection lifecycle (Ch. 10 Part 2, passive/server side, simplified)</text>

  <defs>
    <marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#73726c"/>
    </marker>
  </defs>

  <!-- SYN backlog -->
  <rect x="20" y="60" width="150" height="70" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="95" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#633806">SYN backlog</text>
  <text x="95" y="102" text-anchor="middle" font-size="10" fill="#633806">minimal, flood-resistant</text>
  <text x="95" y="118" text-anchor="middle" font-size="10" fill="#633806">tcpsynbl</text>
  <line x1="170" y1="95" x2="206" y2="95" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowT)"/>

  <!-- Listen backlog -->
  <rect x="210" y="60" width="150" height="70" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="285" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#633806">Listen backlog</text>
  <text x="285" y="102" text-anchor="middle" font-size="10" fill="#633806">handshake done,</text>
  <text x="285" y="118" text-anchor="middle" font-size="10" fill="#633806">waiting on accept()</text>
  <line x1="360" y1="95" x2="396" y2="95" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowT)"/>

  <!-- ESTABLISHED -->
  <rect x="400" y="60" width="150" height="70" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="475" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#085041">ESTABLISHED</text>
  <text x="475" y="102" text-anchor="middle" font-size="10" fill="#085041">tcpaccept (passive)</text>
  <text x="475" y="118" text-anchor="middle" font-size="10" fill="#085041">tcpconnect (active)</text>
  <line x1="550" y1="95" x2="586" y2="95" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowT)"/>

  <!-- CLOSE -->
  <rect x="590" y="60" width="150" height="70" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="665" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C2C2A">CLOSE</text>
  <text x="665" y="102" text-anchor="middle" font-size="10" fill="#2C2C2A">full session summarized</text>
  <text x="665" y="118" text-anchor="middle" font-size="10" fill="#2C2C2A">by tcplife</text>

  <!-- Drop paths underneath -->
  <line x1="95" y1="130" x2="95" y2="180" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#arrowT)"/>
  <rect x="20" y="184" width="150" height="46" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/>
  <text x="95" y="204" text-anchor="middle" font-size="10" fill="#791F1F">SYN flood / drop</text>
  <text x="95" y="220" text-anchor="middle" font-size="10" fill="#791F1F">→ remote retransmits</text>

  <line x1="285" y1="130" x2="285" y2="180" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#arrowT)"/>
  <rect x="210" y="184" width="150" height="46" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/>
  <text x="285" y="204" text-anchor="middle" font-size="10" fill="#791F1F">app too slow to accept()</text>
  <text x="285" y="220" text-anchor="middle" font-size="10" fill="#791F1F">→ listen drop</text>

  <line x1="475" y1="130" x2="475" y2="180" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#arrowT)"/>
  <rect x="400" y="184" width="150" height="46" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/>
  <text x="475" y="204" text-anchor="middle" font-size="10" fill="#791F1F">packet loss, no ACK</text>
  <text x="475" y="220" text-anchor="middle" font-size="10" fill="#791F1F">→ tcpretrans</text>

  <rect x="140" y="250" width="480" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="380" y="274" text-anchor="middle" font-size="11" fill="#2C2C2A">Retransmit state (ESTABLISHED vs. SYN_SENT) tells you whether the cause is network or an overloaded server</text>
</svg>
