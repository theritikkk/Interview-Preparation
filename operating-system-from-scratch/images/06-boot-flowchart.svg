<svg xmlns='http://www.w3.org/2000/svg' width='620' height='620' viewBox='0 0 620 620' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x='0' y='0' width='620' height='620' fill='#fdfdfc'/>
<defs><marker id='arrow' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L0,6 L9,3 z' fill='#3a4556'/></marker></defs>
<rect x='150.0' y='30' width='320' height='64' rx='6' fill='#eaf1fb' stroke='#4a6fa5' stroke-width='1.6'/>
<text x='310.0' y='59.0' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' font-style='normal' text-anchor='middle' fill='#1a2233'>Power on:</text>
<text x='310.0' y='75.0' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>CPU reset vector</text>
<line x1='310.0' y1='94' x2='310.0' y2='120' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<rect x='150.0' y='120' width='320' height='64' rx='6' fill='#eaf1fb' stroke='#4a6fa5' stroke-width='1.6'/>
<text x='310.0' y='149.0' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' font-style='normal' text-anchor='middle' fill='#1a2233'>Firmware (BIOS) runs:</text>
<text x='310.0' y='165.0' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>POST, device init</text>
<line x1='310.0' y1='184' x2='310.0' y2='210' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<rect x='150.0' y='210' width='320' height='64' rx='6' fill='#eaf1fb' stroke='#4a6fa5' stroke-width='1.6'/>
<text x='310.0' y='239.0' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' font-style='normal' text-anchor='middle' fill='#1a2233'>BIOS loads sector 0</text>
<text x='310.0' y='255.0' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>from each device</text>
<line x1='310.0' y1='274' x2='310.0' y2='300' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<rect x='150.0' y='300' width='320' height='64' rx='6' fill='#fff2d9' stroke='#c9820a' stroke-width='1.6'/>
<text x='310.0' y='329.0' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' font-style='normal' text-anchor='middle' fill='#1a2233'>Last 2 bytes</text>
<text x='310.0' y='345.0' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>== 0x55, 0xAA ?</text>
<line x1='310.0' y1='364' x2='310.0' y2='390' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<text x='490.0' y='332.0' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='normal' font-style='normal' text-anchor='start' fill='#c0392b'>no → try next device</text>
<text x='130.0' y='332.0' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11' font-weight='normal' font-style='normal' text-anchor='end' fill='#2f9e5c'>yes</text>
<rect x='150.0' y='390' width='320' height='64' rx='6' fill='#eaf1fb' stroke='#4a6fa5' stroke-width='1.6'/>
<text x='310.0' y='419.0' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' font-style='normal' text-anchor='middle' fill='#1a2233'>Load that sector to</text>
<text x='310.0' y='435.0' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>0x7c00, jump to it</text>
<line x1='310.0' y1='454' x2='310.0' y2='480' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<rect x='150.0' y='480' width='320' height='64' rx='6' fill='#e7f7ee' stroke='#2f9e5c' stroke-width='1.6'/>
<text x='310.0' y='509.0' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='600' font-style='normal' text-anchor='middle' fill='#1a2233'>Your code now runs —</text>
<text x='310.0' y='525.0' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>BIOS's job is done</text>
</svg>
