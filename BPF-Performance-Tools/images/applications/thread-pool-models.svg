<svg width="760" height="380" viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Service thread pool vs event worker thread, and why tid keying works for one but not the other</title>
  <desc>In a service thread pool, each thread handles one request from start to finish, so thread ID is a valid correlation key. In an event worker model, one thread services pieces of many concurrent requests, so thread ID no longer identifies a single request.</desc>
  <rect width="760" height="380" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Why thread ID works as a correlation key for MySQL but not Node.js (Ch. 13)</text>

  <!-- Left: service thread pool -->
  <text x="190" y="54" text-anchor="middle" font-size="13" font-weight="bold" fill="#085041">Service thread pool (MySQL)</text>
  <rect x="40" y="66" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="190" y="90" text-anchor="middle" font-size="11" font-weight="bold" fill="#085041">Thread A</text>
  <text x="190" y="108" text-anchor="middle" font-size="10" fill="#085041">handles Request 1, start to finish</text>

  <rect x="40" y="132" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="190" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#085041">Thread B</text>
  <text x="190" y="174" text-anchor="middle" font-size="10" fill="#085041">handles Request 2, start to finish</text>

  <rect x="60" y="200" width="260" height="46" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="190" y="228" text-anchor="middle" font-size="11" fill="#2C2C2A">@query[tid] = ... is VALID</text>

  <!-- Right: event worker -->
  <text x="570" y="54" text-anchor="middle" font-size="13" font-weight="bold" fill="#712B13">Event worker thread (Node.js)</text>
  <rect x="420" y="66" width="300" height="130" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="570" y="88" text-anchor="middle" font-size="11" font-weight="bold" fill="#712B13">Thread A (the one event loop)</text>

  <rect x="440" y="98" width="110" height="34" rx="6" fill="#ffffff" stroke="#D85A30" stroke-width="0.8"/>
  <text x="495" y="119" text-anchor="middle" font-size="10" fill="#712B13">piece of Req 1</text>
  <rect x="560" y="98" width="140" height="34" rx="6" fill="#ffffff" stroke="#D85A30" stroke-width="0.8"/>
  <text x="630" y="119" text-anchor="middle" font-size="10" fill="#712B13">piece of Req 2</text>
  <rect x="440" y="140" width="110" height="34" rx="6" fill="#ffffff" stroke="#D85A30" stroke-width="0.8"/>
  <text x="495" y="161" text-anchor="middle" font-size="10" fill="#712B13">piece of Req 1</text>
  <rect x="560" y="140" width="140" height="34" rx="6" fill="#ffffff" stroke="#D85A30" stroke-width="0.8"/>
  <text x="630" y="161" text-anchor="middle" font-size="10" fill="#712B13">piece of Req 3</text>

  <rect x="440" y="200" width="260" height="46" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/>
  <text x="570" y="228" text-anchor="middle" font-size="11" fill="#791F1F">@query[tid] = ... MIXES requests up</text>

  <rect x="80" y="280" width="600" height="70" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="380" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C2C2A">Same timestamp-pair idiom either way — the question is what key is actually unique</text>
  <text x="380" y="324" text-anchor="middle" font-size="11" fill="#2C2C2A">to one logical request for the architecture you're tracing, not just "the current thread"</text>
</svg>
