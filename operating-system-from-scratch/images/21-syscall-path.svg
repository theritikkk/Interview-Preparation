<svg xmlns='http://www.w3.org/2000/svg' width='780' height='480' viewBox='0 0 780 480' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x='0' y='0' width='780' height='480' fill='#fdfdfc'/>
<defs><marker id='arrow' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L0,6 L9,3 z' fill='#3a4556'/></marker></defs>
<text x='390.0' y='24' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='14' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>The Syscall Path: Ring 3 to Ring 0 and Back (ENTIRELY BEYOND THE BOOK)</text>
<rect x='110.0' y='50' width='560' height='60' rx='6' fill='#eaf1fb' stroke='#4a6fa5' stroke-width='1.6'/>
<text x='390.0' y='74' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>User program (ring 3)</text>
<text x='390.0' y='94' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5b6472'>rax = syscall number, rdi/rsi/rdx/... = args</text>
<line x1='390.0' y1='110' x2='390.0' y2='128' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<rect x='110.0' y='128' width='560' height='60' rx='6' fill='#fff2d9' stroke='#c9820a' stroke-width='1.6'/>
<text x='390.0' y='152' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>syscall instruction executes</text>
<text x='390.0' y='172' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5b6472'>CPU checks EFER's syscall-enable bit (file 08's MSR idea)</text>
<line x1='390.0' y1='188' x2='390.0' y2='206' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<rect x='110.0' y='206' width='560' height='60' rx='6' fill='#e7f7ee' stroke='#2f9e5c' stroke-width='1.6'/>
<text x='390.0' y='230' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>CPU switches to ring 0</text>
<text x='390.0' y='250' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5b6472'>AND switches stacks — to the address in the TSS's esp0 (file 08)</text>
<line x1='390.0' y1='266' x2='390.0' y2='284' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<rect x='110.0' y='284' width='560' height='60' rx='6' fill='#eaf1fb' stroke='#4a6fa5' stroke-width='1.6'/>
<text x='390.0' y='308' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>Kernel syscall handler runs</text>
<text x='390.0' y='328' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5b6472'>validates every user pointer before touching it (copy_from_user)</text>
<line x1='390.0' y1='344' x2='390.0' y2='362' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<rect x='110.0' y='362' width='560' height='60' rx='6' fill='#fff2d9' stroke='#c9820a' stroke-width='1.6'/>
<text x='390.0' y='386' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>sysret</text>
<text x='390.0' y='406' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5b6472'>back to ring 3, back to the user's own stack, result in rax</text>
<text x='390.0' y='455' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>Same register-passing shape as file 03's BIOS int 0x10 — the difference here is a real privilege-level change.</text>
</svg>
