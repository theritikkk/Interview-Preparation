<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="480" viewBox="0 0 1060 480" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
</defs>
<rect x="0.5" y="0.5" width="1059" height="479" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
<text x="530.0" y="42" font-size="23" font-weight="700" fill="#0f172a" text-anchor="middle">The computer-use agent loop</text>
<text x="530.0" y="68" font-size="14" fill="#475569" text-anchor="middle">Observe → think → act → verify, with the model never touching the machine directly</text>
<rect x="50" y="150" width="215" height="150" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
<rect x="50" y="150" width="215" height="30" rx="10" fill="#2563eb" opacity="0.12"/>
<text x="157.5" y="170" font-size="15" font-weight="700" fill="#2563eb" text-anchor="middle">1 · Observe</text>
<text x="157.5" y="198" font-size="12.5" fill="#0f172a" text-anchor="middle">Capture the screen:</text>
<text x="157.5" y="217" font-size="12.5" fill="#0f172a" text-anchor="middle">screenshot (pixels) or</text>
<text x="157.5" y="236" font-size="12.5" fill="#0f172a" text-anchor="middle">accessibility tree</text>
<text x="157.5" y="255" font-size="12.5" fill="#0f172a" text-anchor="middle">(structured text)</text>
<rect x="300" y="150" width="215" height="150" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/>
<rect x="300" y="150" width="215" height="30" rx="10" fill="#7c3aed" opacity="0.12"/>
<text x="407.5" y="170" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="middle">2 · Think</text>
<text x="407.5" y="198" font-size="12.5" fill="#0f172a" text-anchor="middle">LLM receives observation</text>
<text x="407.5" y="217" font-size="12.5" fill="#0f172a" text-anchor="middle">+ history, outputs one</text>
<text x="407.5" y="236" font-size="12.5" fill="#0f172a" text-anchor="middle">tool call:</text>
<text x="407.5" y="255" font-size="12.5" fill="#0f172a" text-anchor="middle">click / type / key …</text>
<rect x="550" y="150" width="215" height="150" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/>
<rect x="550" y="150" width="215" height="30" rx="10" fill="#d97706" opacity="0.12"/>
<text x="657.5" y="170" font-size="15" font-weight="700" fill="#d97706" text-anchor="middle">3 · Act</text>
<text x="657.5" y="198" font-size="12.5" fill="#0f172a" text-anchor="middle">Executor translates the</text>
<text x="657.5" y="217" font-size="12.5" fill="#0f172a" text-anchor="middle">call into real input:</text>
<text x="657.5" y="236" font-size="12.5" fill="#0f172a" text-anchor="middle">XTEST, SendInput,</text>
<text x="657.5" y="255" font-size="12.5" fill="#0f172a" text-anchor="middle">CGEvent, or DoAction()</text>
<rect x="800" y="150" width="215" height="150" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="1.6"/>
<rect x="800" y="150" width="215" height="30" rx="10" fill="#0d9488" opacity="0.12"/>
<text x="907.5" y="170" font-size="15" font-weight="700" fill="#0d9488" text-anchor="middle">4 · Verify</text>
<text x="907.5" y="198" font-size="12.5" fill="#0f172a" text-anchor="middle">Re-capture after the</text>
<text x="907.5" y="217" font-size="12.5" fill="#0f172a" text-anchor="middle">action and compare:</text>
<text x="907.5" y="236" font-size="12.5" fill="#0f172a" text-anchor="middle">did the screen change</text>
<text x="907.5" y="255" font-size="12.5" fill="#0f172a" text-anchor="middle">the way we expected?</text>
<line x1="269" y1="225.0" x2="294" y2="225.0" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="519" y1="225.0" x2="544" y2="225.0" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="769" y1="225.0" x2="794" y2="225.0" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 907.5 306 L 907.5 360 L 157.5 360 L 157.5 308" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<text x="530.0" y="392" font-size="12.5" fill="#475569" text-anchor="middle">repeat until the task is done (or the step budget runs out)</text>
<text x="530.0" y="424" font-size="12.5" fill="#475569" text-anchor="middle">every iteration re-sends the whole conversation  ·  a screenshot ≈ 0.5–2k tokens  ·  a tree dump ≈ 1–5k tokens</text>
</svg>