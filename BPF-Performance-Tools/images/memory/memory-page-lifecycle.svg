<svg width="760" height="460" viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>The life cycle of a memory page, and which tool observes each step</title>
  <desc>An application requests memory, the allocator extends virtual memory, a page fault establishes a real physical mapping, and under memory pressure the kernel reclaims the page, possibly writing it back or swapping it out.</desc>
  <rect width="760" height="460" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Life cycle of a page, and the tool that observes each step (Ch. 7)</text>

  <defs>
    <marker id="arrowM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#73726c"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <rect x="30" y="50" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="130" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C2C2A">malloc() request</text>
  <text x="130" y="90" text-anchor="middle" font-size="10" fill="#2C2C2A">application asks for memory</text>
  <line x1="230" y1="78" x2="266" y2="78" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowM)"/>

  <!-- Step 2 -->
  <rect x="270" y="50" width="220" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="380" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#712B13">brk() / mmap()</text>
  <text x="380" y="90" text-anchor="middle" font-size="10" fill="#712B13">virtual memory extended — brkstack</text>
  <line x1="490" y1="78" x2="526" y2="78" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowM)"/>

  <!-- Step 3 -->
  <rect x="530" y="50" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <text x="630" y="72" text-anchor="middle" font-size="12" font-weight="bold" fill="#0C447C">first touch</text>
  <text x="630" y="90" text-anchor="middle" font-size="10" fill="#0C447C">load/store — not yet mapped</text>
  <line x1="630" y1="106" x2="630" y2="142" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowM)"/>

  <!-- Step 4: page fault -->
  <rect x="490" y="146" width="240" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="610" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#633806">page fault</text>
  <text x="610" y="186" text-anchor="middle" font-size="10" fill="#633806">kernel maps a real page — faults / ffaults</text>
  <line x1="490" y1="174" x2="454" y2="174" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowM)"/>

  <!-- Step 5: RSS grows -->
  <rect x="250" y="146" width="240" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="370" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#085041">RSS grows</text>
  <text x="370" y="186" text-anchor="middle" font-size="10" fill="#085041">process now owns a physical page</text>
  <line x1="370" y1="202" x2="370" y2="238" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowM)"/>

  <!-- Memory pressure branch point -->
  <rect x="250" y="242" width="240" height="46" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="370" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C2C2A">...time passes, memory pressure rises</text>
  <line x1="370" y1="288" x2="370" y2="324" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowM)"/>

  <!-- vmscan -->
  <rect x="250" y="328" width="240" height="56" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/>
  <text x="370" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#791F1F">kswapd / direct reclaim</text>
  <text x="370" y="368" text-anchor="middle" font-size="10" fill="#791F1F">background or blocking — vmscan, drsnoop</text>

  <!-- branch to swap -->
  <line x1="340" y1="384" x2="220" y2="410" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowM)"/>
  <rect x="40" y="414" width="220" height="40" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="150" y="438" text-anchor="middle" font-size="11" fill="#3C3489">anonymous memory → swap — swapin</text>

  <!-- branch to writeback -->
  <line x1="400" y1="384" x2="560" y2="410" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowM)"/>
  <rect x="470" y="414" width="240" height="40" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="590" y="438" text-anchor="middle" font-size="11" fill="#3C3489">dirty file page → write-back (Ch. 8)</text>

  <!-- OOM side note -->
  <text x="610" y="220" font-size="10" fill="#888780">(if truly out of memory: oomkill)</text>
</svg>
