<svg width="720" height="480" viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Thread state machine and which tool measures which transition</title>
  <desc>A thread moves between ON-PROC (running), RUNNABLE (waiting for a CPU), and SLEEP (blocked off-CPU). profile measures on-CPU time, offcputime measures off-CPU time, runqlat measures the runnable-to-running wait, and wakeuptime measures what triggers the sleep-to-runnable transition.</desc>
  <rect width="720" height="480" fill="#ffffff"/>
  <text x="360" y="26" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Thread states and which tool measures which transition (Ch. 6, Ch. 14)</text>

  <!-- RUNNING state -->
  <ellipse cx="360" cy="90" rx="110" ry="46" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
  <text x="360" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#633806">ON-PROC</text>
  <text x="360" y="104" text-anchor="middle" font-size="11" fill="#633806">(running)</text>

  <!-- RUNNABLE state -->
  <ellipse cx="150" cy="280" rx="110" ry="46" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
  <text x="150" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#0C447C">RUNNABLE</text>
  <text x="150" y="294" text-anchor="middle" font-size="11" fill="#0C447C">(waiting for CPU)</text>

  <!-- SLEEP state -->
  <ellipse cx="570" cy="280" rx="110" ry="46" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1.5"/>
  <text x="570" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#3C3489">SLEEP</text>
  <text x="570" y="294" text-anchor="middle" font-size="11" fill="#3C3489">(blocked off-CPU)</text>

  <defs>
    <marker id="arrowS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#73726c"/>
    </marker>
  </defs>

  <!-- RUNNABLE -> RUNNING (runqlat) -->
  <path d="M 200,245 Q 280,160 310,120" fill="none" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowS)"/>
  <text x="200" y="180" font-size="11" fill="#0C447C" font-weight="bold">runqlat — wait</text>
  <text x="200" y="195" font-size="11" fill="#0C447C">for a turn on CPU</text>

  <!-- RUNNING -> SLEEP (involuntary->runnable handled separately; voluntary to sleep) -->
  <path d="M 420,118 Q 500,180 530,245" fill="none" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowS)"/>
  <text x="470" y="175" font-size="11" fill="#3C3489" font-weight="bold">blocks (I/O, lock,</text>
  <text x="470" y="190" font-size="11" fill="#3C3489">voluntary sleep)</text>

  <!-- RUNNING -> RUNNABLE (preempted, involuntary) -->
  <path d="M 300,125 Q 240,190 195,245" fill="none" stroke="#73726c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowS)"/>
  <text x="200" y="140" font-size="10" fill="#633806">preempted (involuntary)</text>

  <!-- SLEEP -> RUNNABLE (wakeuptime) -->
  <path d="M 500,255 Q 400,220 250,255" fill="none" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowS)"/>
  <text x="330" y="235" text-anchor="middle" font-size="11" fill="#791F1F" font-weight="bold">wakeuptime — who woke it, and from where</text>

  <!-- offcputime annotation spanning the whole off-CPU side -->
  <rect x="100" y="370" width="520" height="44" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/>
  <text x="360" y="396" text-anchor="middle" font-size="12" fill="#791F1F">offcputime = total time in RUNNABLE + SLEEP, with the blocking stack trace</text>

  <rect x="150" y="430" width="420" height="36" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="360" y="453" text-anchor="middle" font-size="12" fill="#633806">profile = samples while ON-PROC (CPU flame graphs)</text>
</svg>
