<text x='40' y='54' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='9' font-weight='normal' font-style='normal' text-anchor='start' fill='#5b6472'>31</text>
<text x='60' y='154' font-family='Consolas,Menlo,Monaco,monospace' font-size='12' font-weight='700' font-style='normal' text-anchor='start' fill='#c0392b'>P</text>
<text x='130' y='154' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='normal' font-style='normal' text-anchor='start' fill='#1a2233'>Present. 0 means not in RAM: any access raises a page fault (exception 14, file 14).</text>
<text x='60' y='180' font-family='Consolas,Menlo,Monaco,monospace' font-size='12' font-weight='700' font-style='normal' text-anchor='start' fill='#4a6fa5'>R/W</text>
<text x='130' y='180' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='normal' font-style='normal' text-anchor='start' fill='#1a2233'>Writable. 0 = read-only; a write raises a page fault. Copy-on-write depends on this.</text>
<text x='60' y='206' font-family='Consolas,Menlo,Monaco,monospace' font-size='12' font-weight='700' font-style='normal' text-anchor='start' fill='#4a6fa5'>U/S</text>
<text x='130' y='206' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='normal' font-style='normal' text-anchor='start' fill='#1a2233'>User-accessible. 0 = kernel only; ring 3 access faults. This is file 21's wall, per page.</text>
<text x='60' y='232' font-family='Consolas,Menlo,Monaco,monospace' font-size='12' font-weight='700' font-style='normal' text-anchor='start' fill='#c9820a'>A / D</text>
<text x='130' y='232' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='normal' font-style='normal' text-anchor='start' fill='#1a2233'>Accessed / Dirty: set by hardware on use / write. Feeds swapping and page reclaim.</text>
<text x='60' y='258' font-family='Consolas,Menlo,Monaco,monospace' font-size='12' font-weight='700' font-style='normal' text-anchor='start' fill='#2f9e5c'>Frame</text>
<text x='130' y='258' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='normal' font-style='normal' text-anchor='start' fill='#1a2233'>Physical page number. 20 bits, because pages are 4 KB aligned (low 12 bits are zero).</text>
</svg>
