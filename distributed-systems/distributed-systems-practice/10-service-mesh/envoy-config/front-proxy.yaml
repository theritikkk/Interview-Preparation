## front-proxy.yaml — real Envoy (the identical proxy Istio injects as a
## sidecar) doing three core service-mesh data-plane behaviors with static
## config instead of istiod's dynamic xDS (istiod can't run here — see
## ../../ANALYSIS.md — but the proxy doing the actual work is the same
## software either way).
##
## Three routes, three real behaviors, each independently verified via
## Envoy's own /stats (not just by observing the app-level outcome):
##   /split   -> weighted traffic split 80% service-v1 / 20% service-v2
##   /retry   -> retry policy against a backend that fails ~40% of the time
##   /circuit -> a circuit breaker with max_connections=2, overloaded with
##               concurrent requests to show Envoy itself rejecting the
##               overflow before it ever reaches the backend
admin:
  address:
    socket_address: { address: 127.0.0.1, port_value: 9901 }

static_resources:
  listeners:
    - name: front_listener
      address:
        socket_address: { address: 127.0.0.1, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: mesh_demo
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/split" }
                          route:
                            weighted_clusters:
                              clusters:
                                - name: service_v1
                                  weight: 80
                                - name: service_v2
                                  weight: 20
                        - match: { prefix: "/retry" }
                          route:
                            cluster: flaky_service
                            retry_policy:
                              retry_on: "5xx"
                              num_retries: 3
                              per_try_timeout: 1s
                        - match: { prefix: "/circuit" }
                          route:
                            cluster: cb_service
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: service_v1
      connect_timeout: 1s
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: service_v1
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 9001 }

    - name: service_v2
      connect_timeout: 1s
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: service_v2
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 9002 }

    - name: flaky_service
      connect_timeout: 1s
      type: STATIC
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: flaky_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 9003 }

    - name: cb_service
      connect_timeout: 1s
      type: STATIC
      lb_policy: ROUND_ROBIN
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 2
            max_pending_requests: 2
            max_requests: 2
            max_retries: 0
      load_assignment:
        cluster_name: cb_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: 127.0.0.1, port_value: 9004 }
