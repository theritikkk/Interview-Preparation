<svg xmlns='http://www.w3.org/2000/svg' width='820' height='460' viewBox='0 0 820 460' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x='0' y='0' width='820' height='460' fill='#fdfdfc'/>
<defs><marker id='arrow' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L0,6 L9,3 z' fill='#3a4556'/></marker></defs>
<text x='410.0' y='24' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>An eBPF Program's Life Cycle</text>
<rect x='70.0' y='48' width='680' height='46' rx='6' fill='#eaf1fb' stroke='#4a6fa5' stroke-width='1.6'/>
<text x='410.0' y='68' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>Restricted C, compiled to eBPF bytecode</text>
<text x='410.0' y='85' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='9.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>clang -target bpf — file 11's pipeline, a stricter dialect</text>
<line x1='410.0' y1='94' x2='410.0' y2='104' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<rect x='70.0' y='104' width='680' height='46' rx='6' fill='#fff2d9' stroke='#c9820a' stroke-width='1.6'/>
<text x='410.0' y='124' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>bpf() syscall loads it into the kernel</text>
<text x='410.0' y='141' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='9.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>file 21's boundary, used to hand bytecode to the kernel</text>
<line x1='410.0' y1='150' x2='410.0' y2='160' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<rect x='70.0' y='160' width='680' height='46' rx='6' fill='#fdecea' stroke='#c0392b' stroke-width='1.6'/>
<text x='410.0' y='180' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>The VERIFIER statically checks it</text>
<text x='410.0' y='197' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='9.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>must provably terminate, stay in bounds, never crash the kernel</text>
<line x1='410.0' y1='206' x2='410.0' y2='216' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<rect x='70.0' y='216' width='680' height='46' rx='6' fill='#eaf1fb' stroke='#4a6fa5' stroke-width='1.6'/>
<text x='410.0' y='236' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>JIT-compiled to native machine code</text>
<text x='410.0' y='253' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='9.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>only after verification passes — for speed</text>
<line x1='410.0' y1='262' x2='410.0' y2='272' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<rect x='70.0' y='272' width='680' height='46' rx='6' fill='#e7f7ee' stroke='#2f9e5c' stroke-width='1.6'/>
<text x='410.0' y='292' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>Attached to a hook point</text>
<text x='410.0' y='309' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='9.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>kprobe, tracepoint, XDP (file 30), cgroup (file 29), syscall</text>
<line x1='410.0' y1='318' x2='410.0' y2='328' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<rect x='70.0' y='328' width='680' height='46' rx='6' fill='#e7f7ee' stroke='#2f9e5c' stroke-width='1.6'/>
<text x='410.0' y='348' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>Runs safely at that hook, writes to a map</text>
<text x='410.0' y='365' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='9.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>a key-value store shared with user space</text>
<line x1='410.0' y1='374' x2='410.0' y2='384' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<rect x='70.0' y='384' width='680' height='46' rx='6' fill='#eaf1fb' stroke='#4a6fa5' stroke-width='1.6'/>
<text x='410.0' y='404' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>A user-space tool (bpftrace, etc.) reads the map</text>
<text x='410.0' y='421' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='9.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>results appear in your terminal</text>
<text x='410.0' y='454' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#c9820a'>Unlike a kernel module (file 25), this code never runs unless the verifier first proves it's safe.</text>
</svg>
