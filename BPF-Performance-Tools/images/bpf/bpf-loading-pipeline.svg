<svg width="760" height="320" viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>How a BPF program gets from source code to running in the kernel</title>
  <desc>bpftrace script or BCC C program is compiled via LLVM to BPF bytecode, loaded with the bpf() syscall, checked by the verifier which either rejects it or passes it to the JIT compiler, which produces native machine code that then runs in the kernel.</desc>
  <rect width="760" height="320" fill="#ffffff"/>
  <text x="380" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Build and load: source code to running kernel code (Ch. 2, Ch. 4, Ch. 5, App. D)</text>

  <!-- USER SPACE band -->
  <rect x="10" y="40" width="740" height="110" fill="#F7F6F2" stroke="none"/>
  <text x="20" y="56" font-size="11" font-weight="bold" fill="#888780">USER SPACE</text>

  <rect x="30" y="68" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="100" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C2C2A">Source</text>
  <text x="100" y="109" text-anchor="middle" font-size="10" fill="#2C2C2A">bpftrace script / BCC C</text>

  <rect x="210" y="68" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
  <text x="280" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#3C3489">LLVM / Clang</text>
  <text x="280" y="109" text-anchor="middle" font-size="10" fill="#3C3489">compiles to BPF bytecode</text>

  <rect x="390" y="68" width="150" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
  <text x="465" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#633806">bpf(2) syscall</text>
  <text x="465" y="109" text-anchor="middle" font-size="10" fill="#633806">BPF_PROG_LOAD request</text>

  <defs>
    <marker id="arrowL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#73726c"/>
    </marker>
  </defs>
  <line x1="170" y1="96" x2="206" y2="96" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowL)"/>
  <line x1="350" y1="96" x2="386" y2="96" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowL)"/>
  <line x1="465" y1="124" x2="465" y2="176" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowL)"/>

  <!-- KERNEL SPACE band -->
  <rect x="10" y="155" width="740" height="150" fill="#EFF6FB" stroke="none"/>
  <text x="20" y="171" font-size="11" font-weight="bold" fill="#0C447C">KERNEL SPACE</text>

  <rect x="390" y="180" width="150" height="56" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/>
  <text x="465" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#791F1F">Verifier</text>
  <text x="465" y="221" text-anchor="middle" font-size="10" fill="#791F1F">checks safety, bounds, loops</text>

  <!-- branch: rejected -->
  <line x1="465" y1="236" x2="465" y2="260" stroke="#73726c" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="465" y="275" text-anchor="middle" font-size="10" fill="#791F1F">unsafe → rejected, load fails</text>

  <!-- branch: accepted -> JIT -->
  <line x1="540" y1="208" x2="590" y2="208" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowL)"/>
  <text x="565" y="198" text-anchor="middle" font-size="9" fill="#2C2C2A">safe</text>

  <rect x="595" y="180" width="140" height="56" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
  <text x="665" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#712B13">JIT compiler</text>
  <text x="665" y="221" text-anchor="middle" font-size="10" fill="#712B13">native machine code</text>

  <line x1="665" y1="236" x2="665" y2="260" stroke="#73726c" stroke-width="1.5" marker-end="url(#arrowL)"/>
  <rect x="560" y="264" width="210" height="36" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="665" y="287" text-anchor="middle" font-size="11" fill="#085041">Attached and running — see bpf-pipeline.svg</text>
</svg>
