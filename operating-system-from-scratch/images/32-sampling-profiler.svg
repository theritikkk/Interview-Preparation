<svg xmlns='http://www.w3.org/2000/svg' width='800' height='520' viewBox='0 0 800 520' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x='0' y='0' width='800' height='520' fill='#fdfdfc'/>
<defs><marker id='arrow' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L0,6 L9,3 z' fill='#3a4556'/></marker></defs>
<text x='400.0' y='24' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='16' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>How a Sampling Profiler Actually Works</text>
<rect x='80.0' y='48' width='640' height='54' rx='6' fill='#fff2d9' stroke='#c9820a' stroke-width='1.6'/>
<text x='400.0' y='71' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>A timer interrupt fires, very fast (e.g. 999 Hz)</text>
<text x='400.0' y='89' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5b6472'>the exact mechanism from files 14 and 20's scheduler tick</text>
<line x1='400.0' y1='102' x2='400.0' y2='116' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<rect x='80.0' y='116' width='640' height='54' rx='6' fill='#eaf1fb' stroke='#4a6fa5' stroke-width='1.6'/>
<text x='400.0' y='139' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>The profiler's handler captures the current stack</text>
<text x='400.0' y='157' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5b6472'>which function, and its whole call chain, right now</text>
<line x1='400.0' y1='170' x2='400.0' y2='184' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<rect x='80.0' y='184' width='640' height='54' rx='6' fill='#eaf1fb' stroke='#4a6fa5' stroke-width='1.6'/>
<text x='400.0' y='207' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>Execution resumes; repeat thousands of times per second</text>
<text x='400.0' y='225' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5b6472'>nothing is instrumented — just sampled</text>
<line x1='400.0' y1='238' x2='400.0' y2='252' stroke='#3a4556' stroke-width='1.8'  marker-end='url(#arrow)'/>
<rect x='80.0' y='252' width='640' height='54' rx='6' fill='#e7f7ee' stroke='#2f9e5c' stroke-width='1.6'/>
<text x='400.0' y='275' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>Samples are aggregated into a histogram</text>
<text x='400.0' y='293' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='10' font-weight='normal' font-style='normal' text-anchor='middle' fill='#5b6472'>which stacks appeared most often</text>
<text x='400.0' y='340' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='13' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>Rendered as a flame graph: width = time, stacking = call depth</text>
<rect x='80.0' y='360' width='640' height='30' rx='6' fill='#f1f1ef' stroke='#9a9a95' stroke-width='1.6'/>
<text x='400.0' y='380' font-family='Consolas,Menlo,Monaco,monospace' font-size='11' font-weight='700' font-style='normal' text-anchor='middle' fill='#1a2233'>main()</text>
<rect x='80.0' y='392' width='352.0' height='30' rx='6' fill='#eaf1fb' stroke='#4a6fa5' stroke-width='1.6'/>
<text x='256.0' y='412' font-family='Consolas,Menlo,Monaco,monospace' font-size='9.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>handle_request()</text>
<rect x='432.0' y='392' width='192.0' height='30' rx='6' fill='#fff2d9' stroke='#c9820a' stroke-width='1.6'/>
<text x='528.0' y='412' font-family='Consolas,Menlo,Monaco,monospace' font-size='9.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>db_query()</text>
<rect x='624.0' y='392' width='96.0' height='30' rx='6' fill='#e7f7ee' stroke='#2f9e5c' stroke-width='1.6'/>
<text x='672.0' y='412' font-family='Consolas,Menlo,Monaco,monospace' font-size='9.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>render()</text>
<rect x='432.0' y='424' width='192.0' height='30' rx='6' fill='#fdecea' stroke='#c0392b' stroke-width='1.6'/>
<text x='528.0' y='444' font-family='Consolas,Menlo,Monaco,monospace' font-size='9.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>wait for lock (file 23)</text>
<text x='400.0' y='480' font-family='Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' font-weight='normal' font-style='normal' text-anchor='middle' fill='#1a2233'>The widest box at any level is where the profiler's samples landed most — that's your hot path.</text>
</svg>
